application: Example Application
owner: Engineering
stack: auto

branches:
  feature_pattern: feature/*
  development: development
  staging: staging
  production: main

promotion:
  staging_sources:
    - development
  production_sources:
    - staging
  emergency_sources: []

quality_checks:
  pr_qa: true
  secret_scan: true
  security_scan: true
  tests: auto
  migration_safety: auto

deployment:
  staging_environment: null
  production_environment: production
  deployment_mechanism: existing-repository-process
  rollback_required: true

phpmyadmin:
  local_allowed: true
  development_allowed: true
  access:
    application_scoped: true
    shared_company_admin: false
    database_scoped: true
    cross_application_access: false
    unrestricted_database_admin: false
    owner_role: Application owner
    developer_group: application-developers
  environments:
    - branch: development
      environment: development
      server: null
      database: null
      database_user_identity: null
      database_scope: null
      phpmyadmin_url: null
      status: not_configured
      notes: Map this only after the actual development server and database are verified.
    - branch: staging
      environment: staging
      server: null
      database: null
      database_user_identity: null
      database_scope: null
      phpmyadmin_url: null
      status: not_configured
      notes: Map this only after the actual staging/UAT server and database are verified.
  staging:
    allowed: true
    require_authentication: true
    require_database_isolation: true
    require_environment_secrets: true
    prefer_network_restriction: true
  production:
    allowed: false
    block_runtime_exposure: true

notes: >
  This file documents repository governance only. Do not store credentials,
  deployment secrets, database values, access tokens, or personal data here.
