name: RoadSense Gate D approval verifier (proposed)
description: Verify and consume a GitHub artifact-bound RoadSense production approval before OIDC or SSM.
inputs:
  expected-json:
    description: Exact release tuple from the protected deployment request.
    required: true
  approval-run-id:
    description: Completed authenticated approval workflow run ID.
    required: true
  require-used:
    description: Reverify the consumed marker in the deployment job before OIDC.
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: Verify and consume exact approval
      shell: bash
      env:
        EXPECTED_JSON: ${{ inputs.expected-json }}
        APPROVAL_RUN_ID: ${{ inputs.approval-run-id }}
        REQUIRE_USED: ${{ inputs.require-used }}
        GH_TOKEN: ${{ github.token }}
        GATE_D_DEPLOY_ACTOR: ${{ github.actor }}
        GATE_D_DEPLOY_ACTOR_ID: ${{ github.actor_id }}
        GATE_D_RUN_ATTEMPT: ${{ github.run_attempt }}
      run: |
        set -euo pipefail
        work_dir="$(mktemp -d)"
        trap 'rm -rf "$work_dir"' EXIT
        printf '%s' "$EXPECTED_JSON" > "$work_dir/expected.json"
        if [[ "$REQUIRE_USED" == 'true' ]]; then
          mode='--require-used'
        elif [[ "$REQUIRE_USED" == 'false' ]]; then
          mode='--mark-used'
        else
          echo 'Invalid Gate D ledger mode' >&2
          exit 1
        fi
        python3 "${{ github.action_path }}/../../tools/roadsense_gate_d.py" \
          "$work_dir/expected.json" "$APPROVAL_RUN_ID" "$mode"
