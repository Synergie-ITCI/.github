name: FieldZilla OpenTofu Plan Authorizer
description: Run central fail-closed FieldZilla remote-state OpenTofu authorization checks.

inputs:
  command:
    required: true
    description: Authorization verifier subcommand.
  actor:
    required: false
    description: GitHub actor requesting approval.
  repository:
    required: false
    description: Repository being applied.
  environment:
    required: false
    description: GitHub environment name.
  expected-sha:
    required: false
    description: Exact approved caller commit SHA.
  github-sha:
    required: false
    description: Executing caller commit SHA.
  expected-plan-sha256:
    required: false
    description: Exact approved OpenTofu plan SHA-256.
  expected-import-map-sha256:
    required: false
    description: Exact approved controlled import mapping SHA-256.
  expires-at:
    required: false
    description: Authorization expiry.
  authorization-id:
    required: false
    description: Single-use authorization id.
  native-reviewers-available:
    required: false
    description: Whether native environment reviewers are available.
  job-workflow-ref:
    required: false
    description: Immutable central workflow identity.
  token-file:
    required: false
    description: OIDC token file for verify-oidc.
  source-run-id:
    required: false
    description: GitHub Actions run ID that generated the approved plan artifact.
  artifact-id:
    required: false
    description: Approved GitHub Actions artifact ID.
  artifact-name:
    required: false
    description: Approved GitHub Actions artifact name.
  expected-artifact-digest:
    required: false
    description: Expected GitHub artifact digest.
  artifact-dir:
    required: false
    description: Directory containing the downloaded artifact.
  plan-json-path:
    required: false
    description: JSON OpenTofu plan path for safety verification.
  import-map-path:
    required: false
    description: JSON import mapping path.
  backend-metadata-path:
    required: false
    description: Backend evidence JSON path.
  plan-kind:
    required: false
    description: normal, post-import, drift or final plan.

runs:
  using: composite
  steps:
    - name: Run authorization verifier
      shell: bash
      env:
        SCRIPT_PATH: ${{ github.action_path }}/opentofu_plan_authorization.py
        COMMAND: ${{ inputs.command }}
        ACTOR: ${{ inputs.actor }}
        REPOSITORY: ${{ inputs.repository }}
        ENVIRONMENT: ${{ inputs.environment }}
        EXPECTED_SHA: ${{ inputs.expected-sha }}
        GITHUB_SHA_INPUT: ${{ inputs.github-sha }}
        EXPECTED_PLAN_SHA256: ${{ inputs.expected-plan-sha256 }}
        EXPECTED_IMPORT_MAP_SHA256: ${{ inputs.expected-import-map-sha256 }}
        EXPIRES_AT: ${{ inputs.expires-at }}
        AUTHORIZATION_ID: ${{ inputs.authorization-id }}
        NATIVE_REVIEWERS_AVAILABLE: ${{ inputs.native-reviewers-available }}
        JOB_WORKFLOW_REF: ${{ inputs.job-workflow-ref }}
        TOKEN_FILE: ${{ inputs.token-file }}
        SOURCE_RUN_ID: ${{ inputs.source-run-id }}
        ARTIFACT_ID: ${{ inputs.artifact-id }}
        ARTIFACT_NAME: ${{ inputs.artifact-name }}
        EXPECTED_ARTIFACT_DIGEST: ${{ inputs.expected-artifact-digest }}
        ARTIFACT_DIR: ${{ inputs.artifact-dir }}
        PLAN_JSON_PATH: ${{ inputs.plan-json-path }}
        IMPORT_MAP_PATH: ${{ inputs.import-map-path }}
        BACKEND_METADATA_PATH: ${{ inputs.backend-metadata-path }}
        PLAN_KIND: ${{ inputs.plan-kind }}
      run: |
        set -euo pipefail
        common_args=(
          --actor "${ACTOR}"
          --repository "${REPOSITORY}"
          --environment "${ENVIRONMENT}"
          --expected-sha "${EXPECTED_SHA}"
          --github-sha "${GITHUB_SHA_INPUT}"
          --expected-plan-sha256 "${EXPECTED_PLAN_SHA256}"
          --expected-import-map-sha256 "${EXPECTED_IMPORT_MAP_SHA256}"
          --expires-at "${EXPIRES_AT}"
          --authorization-id "${AUTHORIZATION_ID}"
          --native-reviewers-available "${NATIVE_REVIEWERS_AVAILABLE}"
          --job-workflow-ref "${JOB_WORKFLOW_REF}"
        )
        case "${COMMAND}" in
          verify-inputs|check-single-use|mark-used)
            python3 "${SCRIPT_PATH}" "${COMMAND}" "${common_args[@]}"
            ;;
          verify-oidc)
            python3 "${SCRIPT_PATH}" verify-oidc \
              --token-file "${TOKEN_FILE}" \
              --job-workflow-ref "${JOB_WORKFLOW_REF}"
            ;;
          verify-native-reviewers)
            python3 "${SCRIPT_PATH}" verify-native-reviewers \
              --native-reviewers-available "${NATIVE_REVIEWERS_AVAILABLE}"
            ;;
          verify-backend)
            python3 "${SCRIPT_PATH}" verify-backend \
              --backend-metadata-path "${BACKEND_METADATA_PATH}"
            ;;
          verify-source-artifact)
            python3 "${SCRIPT_PATH}" verify-source-artifact "${common_args[@]}" \
              --source-run-id "${SOURCE_RUN_ID}" \
              --artifact-id "${ARTIFACT_ID}" \
              --artifact-name "${ARTIFACT_NAME}" \
              --expected-artifact-digest "${EXPECTED_ARTIFACT_DIGEST}"
            ;;
          verify-artifact-metadata)
            python3 "${SCRIPT_PATH}" verify-artifact-metadata \
              --artifact-dir "${ARTIFACT_DIR}" \
              --expected-sha "${EXPECTED_SHA}" \
              --expected-plan-sha256 "${EXPECTED_PLAN_SHA256}" \
              --expected-import-map-sha256 "${EXPECTED_IMPORT_MAP_SHA256}" \
              --source-run-id "${SOURCE_RUN_ID}" \
              --artifact-id "${ARTIFACT_ID}" \
              --artifact-name "${ARTIFACT_NAME}" \
              --expected-artifact-digest "${EXPECTED_ARTIFACT_DIGEST}"
            ;;
          verify-artifact-files)
            python3 "${SCRIPT_PATH}" verify-artifact-files \
              --artifact-dir "${ARTIFACT_DIR}"
            ;;
          verify-plan-safety)
            python3 "${SCRIPT_PATH}" verify-plan-safety \
              --plan-json-path "${PLAN_JSON_PATH}" \
              --plan-kind "${PLAN_KIND}"
            ;;
          verify-import-map)
            python3 "${SCRIPT_PATH}" verify-import-map \
              --import-map-path "${IMPORT_MAP_PATH}" \
              --expected-import-map-sha256 "${EXPECTED_IMPORT_MAP_SHA256}"
            ;;
          *)
            echo "unsupported verifier command" >&2
            exit 1
            ;;
        esac
