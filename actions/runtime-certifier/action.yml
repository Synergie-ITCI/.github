name: Synergie Runtime Certifier
description: Read-only runtime certification immediately before Gate D deployment.

inputs:
  instance-id:
    description: EC2 or SSM managed-instance ID.
    required: true

  region:
    description: AWS region.
    required: false
    default: ap-south-1

  app-path:
    description: Absolute application path on the target host.
    required: true

  app-user:
    description: OS user used to resolve the deployed Git SHA.
    required: true

  validation-url:
    description: HTTPS endpoint validated before deployment.
    required: true

  deploy-ref:
    description: Exact approved 40-character deployment SHA.
    required: true

  rollback-ref:
    description: Exact known-good rollback SHA, or SHA-256 for legacy-baseline mode.
    required: true

  rollback-kind:
    description: exact-sha or the one-time legacy-baseline mode.
    required: false
    default: exact-sha

  legacy-baseline-path:
    description: Absolute immutable artifact path required in legacy-baseline mode.
    required: false
    default: ""

  repository:
    description: Calling repository, required to bind exceptional baseline authorizations.
    required: false
    default: ""

  runtime-kind:
    description: Runtime adapter.
    required: false
    default: php-fpm

  runtime-version:
    description: Required runtime version. Use major.minor for php-fpm, vite for static-vite-apache, or django-major.minor[.patch] for django-gunicorn-nginx.
    required: true

  web-server:
    description: Web-server adapter.
    required: false
    default: apache

  governance-config:
    description: Repository governance config containing persistent_data declarations.
    required: false
    default: .github/synergie-governance.yml

  host-profile:
    description: Optional centrally bundled, instance-bound co-host profile ID. Empty preserves the existing application-only contract.
    required: false
    default: ""

outputs:
  host-certification:
    description: PASS only after all requested host checks pass; FAIL on failure; empty when not requested.
    value: ${{ steps.certify.outputs.host-certification }}

  failed-site:
    description: Safe site label on opted-in failure, otherwise empty.
    value: ${{ steps.certify.outputs.failed-site }}

  failed-reason:
    description: Fixed failure category on opted-in failure, otherwise empty.
    value: ${{ steps.certify.outputs.failed-reason }}

  deploy-state:
    description: Validated deployment state, including an explicitly authorized legacy baseline.
    value: ${{ steps.certify.outputs.deploy_state }}

  deployment-required:
    description: true when Gate D should execute its deployment step
    value: ${{ steps.certify.outputs.deployment_required }}

runs:
  using: composite

  steps:
    - name: Certify target runtime
      id: certify
      shell: bash
      env:
        RUNTIME_CERTIFIER_HOST_PROFILE: ${{ inputs.host-profile }}
      run: |
        set -euo pipefail

        python3 "${{ github.action_path }}/../../tools/runtime_certifier.py" \
          --instance-id "${{ inputs.instance-id }}" \
          --region "${{ inputs.region }}" \
          --app-path "${{ inputs.app-path }}" \
          --app-user "${{ inputs.app-user }}" \
          --validation-url "${{ inputs.validation-url }}" \
          --deploy-ref "${{ inputs.deploy-ref }}" \
          --rollback-ref "${{ inputs.rollback-ref }}" \
          --rollback-kind "${{ inputs.rollback-kind }}" \
          --legacy-baseline-path "${{ inputs.legacy-baseline-path }}" \
          --repository "${{ inputs.repository }}" \
          --runtime-kind "${{ inputs.runtime-kind }}" \
          --runtime-version "${{ inputs.runtime-version }}" \
          --web-server "${{ inputs.web-server }}" \
          --governance-config "${{ inputs.governance-config }}"
