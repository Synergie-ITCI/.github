name: PR Quality Assurance

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: pr-qa-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-qa:
    name: Pull Request Quality Assurance
    if: github.event.pull_request.draft == false
    uses: ./.github/workflows/pr-qa.yml
