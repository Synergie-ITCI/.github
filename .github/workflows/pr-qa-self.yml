name: PR QA

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited
  merge_group:

permissions:
  contents: read

concurrency:
  group: pr-qa-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-qa:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    uses: ./.github/workflows/pr-qa.yml
    with:
      repository-profile: framework
