name: pr-qa

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: pr-qa-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-qa:
    if: github.event.pull_request.draft == false
    uses: ./.github/workflows/pr-qa.yml

  compatibility:
    name: Pull Request Quality Assurance / Pull Request Quality Assurance
    runs-on: ubuntu-latest
    needs: pr-qa
    if: always() && github.event.pull_request.draft == false
    steps:
      - name: Mirror canonical PR-QA result
        env:
          PR_QA_RESULT: ${{ needs.pr-qa.result }}
        run: |
          test "${PR_QA_RESULT}" = "success"
