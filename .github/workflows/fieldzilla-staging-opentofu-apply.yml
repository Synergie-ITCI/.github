name: FieldZilla Staging OpenTofu Remote State

on:
  workflow_call:
    inputs:
      mode:
        description: bootstrap, plan, import, post-import-plan, drift, or apply.
        required: true
        type: string
      import-map-json:
        description: Approved import-map.json content. Required only for mode=import.
        required: false
        type: string
      expected-sha:
        description: Exact approved programme-management-platform commit SHA.
        required: true
        type: string
      expected-plan-sha256:
        description: Exact SHA-256 of the approved OpenTofu binary plan file.
        required: false
        type: string
      expected-import-map-sha256:
        description: Exact SHA-256 of the approved import-map.json file.
        required: false
        type: string
      source-plan-run-id:
        description: Successful GitHub Actions run ID that uploaded the approved artifact.
        required: false
        type: string
      artifact-id:
        description: Approved immutable GitHub Actions artifact ID.
        required: false
        type: string
      artifact-name:
        description: Approved immutable GitHub Actions artifact name.
        required: false
        type: string
      expected-artifact-digest:
        description: Expected GitHub artifact digest.
        required: false
        type: string
      expires-at:
        description: ISO-8601 expiry, at most 60 minutes after approval.
        required: false
        type: string
      authorization-id:
        description: Single-use authorization id.
        required: false
        type: string
      native-reviewers-available:
        description: Must be false; native environment reviewers take precedence when available.
        required: true
        type: boolean

permissions:
  actions: read
  contents: read
  deployments: write
  id-token: write

concurrency:
  group: fieldzilla-staging-opentofu-remote-state
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  AWS_ACCOUNT_ID: "918870682888"
  STATE_BUCKET: synergie-fieldzilla-opentofu-state-918870682888-ap-south-1
  STATE_KEY: programme-management-platform/fieldzilla/staging/opentofu.tfstate
  STATE_LOCK_TABLE: synergie-fieldzilla-opentofu-locks
  STATE_KMS_ALIAS: alias/synergie/fieldzilla/opentofu-state
  INFRA_APPLY_ROLE_ARN: arn:aws:iam::918870682888:role/SynergieProgrammeManagementPlatformStagingInfraApplyRole
  CENTRAL_WORKFLOW_REF: Synergie-ITCI/.github/.github/workflows/fieldzilla-staging-opentofu-apply.yml@refs/tags/pr-qa-v1-rc122

jobs:
  remote-state:
    name: FieldZilla Remote-State OpenTofu
    runs-on: ubuntu-latest
    environment: synergie-app-staging
    timeout-minutes: 45

    steps:
      - name: Reject unsupported mode
        if: ${{ !contains(fromJSON('["bootstrap","plan","import","post-import-plan","drift","apply"]'), inputs.mode) }}
        run: |
          echo "unsupported mode: ${{ inputs.mode }}" >&2
          exit 1

      - name: Checkout caller repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected-sha }}
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.INFRA_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify caller identity
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "${AWS_ACCOUNT_ID}"

      - name: Verify central workflow OIDC identity
        if: ${{ inputs.mode == 'bootstrap' || inputs.mode == 'import' || inputs.mode == 'apply' }}
        run: |
          set -euo pipefail
          token_path="${RUNNER_TEMP}/fieldzilla-oidc.jwt"
          curl -fsSL \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' > "${token_path}"
          echo "TOKEN_PATH=${token_path}" >> "${GITHUB_ENV}"

      - name: Validate mutation authorization inputs
        if: ${{ inputs.mode == 'bootstrap' || inputs.mode == 'import' || inputs.mode == 'apply' }}
        uses: Synergie-ITCI/.github/actions/opentofu-plan-authorizer@pr-qa-v1-rc122
        with:
          command: verify-inputs
          actor: ${{ github.actor }}
          repository: ${{ github.repository }}
          environment: synergie-app-staging
          expected-sha: ${{ inputs.expected-sha }}
          github-sha: ${{ github.sha }}
          expected-plan-sha256: ${{ inputs.expected-plan-sha256 }}
          expected-import-map-sha256: ${{ inputs.expected-import-map-sha256 }}
          expires-at: ${{ inputs.expires-at }}
          authorization-id: ${{ inputs.authorization-id }}
          native-reviewers-available: ${{ inputs.native-reviewers-available }}
          job-workflow-ref: ${{ env.CENTRAL_WORKFLOW_REF }}

      - name: Verify OIDC token claims
        if: ${{ inputs.mode == 'bootstrap' || inputs.mode == 'import' || inputs.mode == 'apply' }}
        uses: Synergie-ITCI/.github/actions/opentofu-plan-authorizer@pr-qa-v1-rc122
        with:
          command: verify-oidc
          token-file: ${{ env.TOKEN_PATH }}
          job-workflow-ref: ${{ env.CENTRAL_WORKFLOW_REF }}

      - name: Remove OIDC token
        if: ${{ always() && env.TOKEN_PATH != '' }}
        run: rm -f "${TOKEN_PATH}"

      - name: Verify native reviewer fallback is available
        if: ${{ inputs.mode == 'bootstrap' || inputs.mode == 'import' || inputs.mode == 'apply' }}
        env:
          GH_TOKEN: ${{ github.token }}
        uses: Synergie-ITCI/.github/actions/opentofu-plan-authorizer@pr-qa-v1-rc122
        with:
          command: verify-native-reviewers
          native-reviewers-available: ${{ inputs.native-reviewers-available }}

      - name: Check authorization has not been used
        if: ${{ inputs.mode == 'bootstrap' || inputs.mode == 'import' || inputs.mode == 'apply' }}
        env:
          GH_TOKEN: ${{ github.token }}
        uses: Synergie-ITCI/.github/actions/opentofu-plan-authorizer@pr-qa-v1-rc122
        with:
          command: check-single-use
          actor: ${{ github.actor }}
          repository: ${{ github.repository }}
          environment: synergie-app-staging
          expected-sha: ${{ inputs.expected-sha }}
          github-sha: ${{ github.sha }}
          expected-plan-sha256: ${{ inputs.expected-plan-sha256 }}
          expected-import-map-sha256: ${{ inputs.expected-import-map-sha256 }}
          expires-at: ${{ inputs.expires-at }}
          authorization-id: ${{ inputs.authorization-id }}
          native-reviewers-available: ${{ inputs.native-reviewers-available }}
          job-workflow-ref: ${{ env.CENTRAL_WORKFLOW_REF }}

      - name: Mark bootstrap authorization used
        if: ${{ inputs.mode == 'bootstrap' }}
        env:
          GH_TOKEN: ${{ github.token }}
        uses: Synergie-ITCI/.github/actions/opentofu-plan-authorizer@pr-qa-v1-rc122
        with:
          command: mark-used
          actor: ${{ github.actor }}
          repository: ${{ github.repository }}
          environment: synergie-app-staging
          expected-sha: ${{ inputs.expected-sha }}
          github-sha: ${{ github.sha }}
          expected-plan-sha256: ${{ inputs.expected-plan-sha256 }}
          expected-import-map-sha256: ${{ inputs.expected-import-map-sha256 }}
          expires-at: ${{ inputs.expires-at }}
          authorization-id: ${{ inputs.authorization-id }}
          native-reviewers-available: ${{ inputs.native-reviewers-available }}
          job-workflow-ref: ${{ env.CENTRAL_WORKFLOW_REF }}

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.12.5
          tofu_wrapper: false

      - name: Bootstrap encrypted remote-state backend
        run: |
          set -euo pipefail
          key_id="$(aws kms describe-key --key-id "${STATE_KMS_ALIAS}" --query KeyMetadata.KeyId --output text 2>/dev/null || true)"
          if [ -z "${key_id}" ] || [ "${key_id}" = "None" ]; then
            key_id="$(aws kms create-key \
              --description "FieldZilla staging OpenTofu state encryption" \
              --tags TagKey=Application,TagValue=fieldzilla TagKey=Environment,TagValue=staging TagKey=ManagedBy,TagValue=github-actions \
              --query KeyMetadata.KeyId --output text)"
            aws kms enable-key-rotation --key-id "${key_id}"
            aws kms create-alias --alias-name "${STATE_KMS_ALIAS}" --target-key-id "${key_id}"
          fi
          if ! aws s3api head-bucket --bucket "${STATE_BUCKET}" >/dev/null 2>&1; then
            aws s3api create-bucket \
              --bucket "${STATE_BUCKET}" \
              --region "${AWS_REGION}" \
              --create-bucket-configuration "LocationConstraint=${AWS_REGION}"
          fi
          aws s3api put-public-access-block \
            --bucket "${STATE_BUCKET}" \
            --public-access-block-configuration BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
          aws s3api put-bucket-versioning \
            --bucket "${STATE_BUCKET}" \
            --versioning-configuration Status=Enabled
          aws s3api put-bucket-encryption \
            --bucket "${STATE_BUCKET}" \
            --server-side-encryption-configuration "{\"Rules\":[{\"ApplyServerSideEncryptionByDefault\":{\"SSEAlgorithm\":\"aws:kms\",\"KMSMasterKeyID\":\"${STATE_KMS_ALIAS}\"}}]}"
          aws s3api put-bucket-tagging \
            --bucket "${STATE_BUCKET}" \
            --tagging 'TagSet=[{Key=Application,Value=fieldzilla},{Key=Environment,Value=staging},{Key=Repository,Value=Synergie-ITCI/programme-management-platform},{Key=ManagedBy,Value=github-actions}]'
          aws dynamodb describe-table --table-name "${STATE_LOCK_TABLE}" >/dev/null 2>&1 || \
            aws dynamodb create-table \
              --table-name "${STATE_LOCK_TABLE}" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST \
              --sse-specification Enabled=true,SSEType=KMS,KMSMasterKeyId="${STATE_KMS_ALIAS}" \
              --tags Key=Application,Value=fieldzilla Key=Environment,Value=staging Key=Repository,Value=Synergie-ITCI/programme-management-platform Key=ManagedBy,Value=github-actions >/dev/null
          aws dynamodb wait table-exists --table-name "${STATE_LOCK_TABLE}"

      - name: Render remote backend override
        run: |
          set -euo pipefail
          cat > infra/aws/backend_override.tf <<BACKEND
          terraform {
            backend "s3" {
              bucket         = "${STATE_BUCKET}"
              key            = "${STATE_KEY}"
              region         = "${AWS_REGION}"
              encrypt        = true
              kms_key_id     = "${STATE_KMS_ALIAS}"
              dynamodb_table = "${STATE_LOCK_TABLE}"
            }
          }
          BACKEND

      - name: Verify backend controls
        run: |
          set -euo pipefail
          encryption="$(aws s3api get-bucket-encryption --bucket "${STATE_BUCKET}" --query 'ServerSideEncryptionConfiguration.Rules[0].ApplyServerSideEncryptionByDefault.SSEAlgorithm' --output text)"
          versioning="$(aws s3api get-bucket-versioning --bucket "${STATE_BUCKET}" --query Status --output text)"
          pab="$(aws s3api get-public-access-block --bucket "${STATE_BUCKET}" --query 'PublicAccessBlockConfiguration.[BlockPublicAcls,IgnorePublicAcls,BlockPublicPolicy,RestrictPublicBuckets]' --output text)"
          ENCRYPTION="${encryption}" VERSIONING="${versioning}" PAB="${pab}" python3 -c 'import json,os,pathlib; doc={"account_id":os.environ["AWS_ACCOUNT_ID"],"region":os.environ["AWS_REGION"],"bucket":os.environ["STATE_BUCKET"],"key":os.environ["STATE_KEY"],"dynamodb_table":os.environ["STATE_LOCK_TABLE"],"bucket_versioning":os.environ["VERSIONING"],"bucket_encryption":os.environ["ENCRYPTION"],"public_access_blocked":os.environ["PAB"].split()==["True","True","True","True"]}; pathlib.Path(os.environ["RUNNER_TEMP"],"backend.json").write_text(json.dumps(doc, indent=2, sort_keys=True)); print(json.dumps(doc, indent=2, sort_keys=True))'

      - name: Verify backend metadata
        uses: Synergie-ITCI/.github/actions/opentofu-plan-authorizer@pr-qa-v1-rc122
        with:
          command: verify-backend
          backend-metadata-path: ${{ runner.temp }}/backend.json

      - name: Initialize remote OpenTofu state
        run: |
          set -euo pipefail
          tofu -chdir=infra/aws fmt -check
          tofu -chdir=infra/aws init -input=false -lockfile=readonly
          tofu -chdir=infra/aws validate

      - name: Backup current remote state object
        if: ${{ inputs.mode == 'import' || inputs.mode == 'apply' }}
        run: |
          set -euo pipefail
          evidence_dir="${RUNNER_TEMP}/state-evidence"
          mkdir -p "${evidence_dir}"
          if aws s3api head-object --bucket "${STATE_BUCKET}" --key "${STATE_KEY}" >/dev/null 2>&1; then
            aws s3 cp "s3://${STATE_BUCKET}/${STATE_KEY}" "${evidence_dir}/state-before.tfstate"
            sha256sum "${evidence_dir}/state-before.tfstate" | awk '{print "STATE_BEFORE_SHA256="$1}' | tee "${evidence_dir}/state-before.sha256"
            aws s3 cp "s3://${STATE_BUCKET}/${STATE_KEY}" \
              "s3://${STATE_BUCKET}/backups/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/opentofu.tfstate"
          else
            echo "STATE_BEFORE_SHA256=ABSENT" | tee "${evidence_dir}/state-before.sha256"
          fi
          echo "STATE_EVIDENCE_DIR=${evidence_dir}" >> "${GITHUB_ENV}"

      - name: Generate plan artifact
        if: ${{ inputs.mode == 'plan' || inputs.mode == 'post-import-plan' || inputs.mode == 'drift' }}
        env:
          ARTIFACT_NAME: fieldzilla-staging-${{ inputs.mode == 'post-import-plan' && 'post-import' || inputs.mode }}-${{ inputs.expected-sha }}-${{ github.run_id }}
          EXPECTED_SHA: ${{ inputs.expected-sha }}
        run: |
          set -euo pipefail
          plan_dir="${RUNNER_TEMP}/fieldzilla-plan"
          mkdir -p "${plan_dir}"
          tofu -chdir=infra/aws plan -input=false -lock=true -out="${plan_dir}/fieldzilla-staging.tfplan"
          tofu -chdir=infra/aws show -no-color "${plan_dir}/fieldzilla-staging.tfplan" > "${plan_dir}/fieldzilla-staging.plan.txt"
          tofu -chdir=infra/aws show -json "${plan_dir}/fieldzilla-staging.tfplan" > "${plan_dir}/fieldzilla-staging.plan.json"
          cp "${RUNNER_TEMP}/backend.json" "${plan_dir}/backend.json"
          plan_sha="$(sha256sum "${plan_dir}/fieldzilla-staging.tfplan" | awk '{print $1}')"
          lock_sha="$(sha256sum infra/aws/.terraform.lock.hcl | awk '{print $1}')"
          tofu_version="$(tofu version -json | python3 -c 'import json,sys; print(json.load(sys.stdin)["terraform_version"])')"
          export PLAN_SHA="${plan_sha}"
          export LOCK_SHA="${lock_sha}"
          export TOFU_VERSION="${tofu_version}"
          python3 -c 'import json,os; from datetime import datetime, timezone; print(json.dumps({"repository":"Synergie-ITCI/programme-management-platform","environment":"synergie-app-staging","commit_sha":os.environ["EXPECTED_SHA"],"workflow_run_id":os.environ["GITHUB_RUN_ID"],"workflow_run_attempt":os.environ["GITHUB_RUN_ATTEMPT"],"artifact_name":os.environ["ARTIFACT_NAME"],"generated_at":datetime.now(timezone.utc).isoformat().replace("+00:00","Z"),"opentofu_version":os.environ["TOFU_VERSION"],"provider_lock_sha256":os.environ["LOCK_SHA"],"plan_sha256":os.environ["PLAN_SHA"],"state_backend":"s3","state_bucket":os.environ["STATE_BUCKET"],"state_key":os.environ["STATE_KEY"],"lock_table":os.environ["STATE_LOCK_TABLE"]}, indent=2, sort_keys=True))' > "${plan_dir}/metadata.json"
          {
            echo "${plan_sha}  fieldzilla-staging.tfplan"
            sha256sum "${plan_dir}/fieldzilla-staging.plan.txt" | sed "s#${plan_dir}/##"
            sha256sum "${plan_dir}/fieldzilla-staging.plan.json" | sed "s#${plan_dir}/##"
            sha256sum "${plan_dir}/backend.json" | sed "s#${plan_dir}/##"
            sha256sum "${plan_dir}/metadata.json" | sed "s#${plan_dir}/##"
          } > "${plan_dir}/SHA256SUMS"
          {
            echo "PLAN_DIR=${plan_dir}"
            echo "PLAN_SHA256=${plan_sha}"
            echo "ARTIFACT_NAME=${ARTIFACT_NAME}"
          } >> "${GITHUB_ENV}"

      - name: Verify generated plan safety
        if: ${{ inputs.mode == 'plan' || inputs.mode == 'post-import-plan' || inputs.mode == 'drift' }}
        uses: Synergie-ITCI/.github/actions/opentofu-plan-authorizer@pr-qa-v1-rc122
        with:
          command: verify-plan-safety
          plan-json-path: ${{ runner.temp }}/fieldzilla-plan/fieldzilla-staging.plan.json
          plan-kind: ${{ inputs.mode == 'plan' && 'normal' || inputs.mode == 'post-import-plan' && 'post-import' || 'drift' }}

      - name: Verify generated artifact contents
        if: ${{ inputs.mode == 'plan' || inputs.mode == 'post-import-plan' || inputs.mode == 'drift' }}
        uses: Synergie-ITCI/.github/actions/opentofu-plan-authorizer@pr-qa-v1-rc122
        with:
          command: verify-artifact-files
          artifact-dir: ${{ runner.temp }}/fieldzilla-plan

      - name: Upload generated artifact
        if: ${{ inputs.mode == 'plan' || inputs.mode == 'post-import-plan' || inputs.mode == 'drift' }}
        id: upload-generated
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ runner.temp }}/fieldzilla-plan
          if-no-files-found: error
          overwrite: false
          retention-days: 1

      - name: Download approved artifact
        if: ${{ inputs.mode == 'apply' }}
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ inputs.artifact-id }}
          path: ${{ runner.temp }}/approved/${{ inputs.artifact-name }}
          github-token: ${{ github.token }}
          repository: Synergie-ITCI/programme-management-platform
          run-id: ${{ inputs.source-plan-run-id }}

      - name: Verify approved artifact
        if: ${{ inputs.mode == 'apply' }}
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_DIR: ${{ runner.temp }}/approved/${{ inputs.artifact-name }}/${{ inputs.artifact-name }}
        run: |
          set -euo pipefail
          echo "APPROVED_DIR=${APPROVED_DIR}" >> "${GITHUB_ENV}"

      - name: Verify approved source artifact
        if: ${{ inputs.mode == 'apply' }}
        env:
          GH_TOKEN: ${{ github.token }}
        uses: Synergie-ITCI/.github/actions/opentofu-plan-authorizer@pr-qa-v1-rc122
        with:
          command: verify-source-artifact
          actor: ${{ github.actor }}
          repository: ${{ github.repository }}
          environment: synergie-app-staging
          expected-sha: ${{ inputs.expected-sha }}
          github-sha: ${{ github.sha }}
          expected-plan-sha256: ${{ inputs.expected-plan-sha256 }}
          expected-import-map-sha256: ${{ inputs.expected-import-map-sha256 }}
          expires-at: ${{ inputs.expires-at }}
          authorization-id: ${{ inputs.authorization-id }}
          native-reviewers-available: ${{ inputs.native-reviewers-available }}
          job-workflow-ref: ${{ env.CENTRAL_WORKFLOW_REF }}
          source-run-id: ${{ inputs.source-plan-run-id }}
          artifact-id: ${{ inputs.artifact-id }}
          artifact-name: ${{ inputs.artifact-name }}
          expected-artifact-digest: ${{ inputs.expected-artifact-digest }}

      - name: Verify approved artifact metadata and files
        if: ${{ inputs.mode == 'apply' }}
        uses: Synergie-ITCI/.github/actions/opentofu-plan-authorizer@pr-qa-v1-rc122
        with:
          command: verify-artifact-metadata
          artifact-dir: ${{ env.APPROVED_DIR }}
          expected-sha: ${{ inputs.expected-sha }}
          expected-plan-sha256: ${{ inputs.expected-plan-sha256 }}
          expected-import-map-sha256: ${{ inputs.expected-import-map-sha256 }}
          source-run-id: ${{ inputs.source-plan-run-id }}
          artifact-id: ${{ inputs.artifact-id }}
          artifact-name: ${{ inputs.artifact-name }}
          expected-artifact-digest: ${{ inputs.expected-artifact-digest }}

      - name: Verify approved artifact file allowlist
        if: ${{ inputs.mode == 'apply' }}
        uses: Synergie-ITCI/.github/actions/opentofu-plan-authorizer@pr-qa-v1-rc122
        with:
          command: verify-artifact-files
          artifact-dir: ${{ env.APPROVED_DIR }}

      - name: Render approved import map
        if: ${{ inputs.mode == 'import' }}
        env:
          IMPORT_MAP_JSON: ${{ inputs.import-map-json }}
        run: |
          set -euo pipefail
          if [ -z "${IMPORT_MAP_JSON}" ]; then
            echo "import-map-json is required for import mode" >&2
            exit 1
          fi
          import_dir="${RUNNER_TEMP}/approved-import"
          mkdir -p "${import_dir}"
          printf '%s' "${IMPORT_MAP_JSON}" > "${import_dir}/import-map.json"
          echo "APPROVED_DIR=${import_dir}" >> "${GITHUB_ENV}"

      - name: Verify approved import map
        if: ${{ inputs.mode == 'import' }}
        uses: Synergie-ITCI/.github/actions/opentofu-plan-authorizer@pr-qa-v1-rc122
        with:
          command: verify-import-map
          import-map-path: ${{ env.APPROVED_DIR }}/import-map.json
          expected-import-map-sha256: ${{ inputs.expected-import-map-sha256 }}

      - name: Mark import authorization used
        if: ${{ inputs.mode == 'import' }}
        env:
          GH_TOKEN: ${{ github.token }}
        uses: Synergie-ITCI/.github/actions/opentofu-plan-authorizer@pr-qa-v1-rc122
        with:
          command: mark-used
          actor: ${{ github.actor }}
          repository: ${{ github.repository }}
          environment: synergie-app-staging
          expected-sha: ${{ inputs.expected-sha }}
          github-sha: ${{ github.sha }}
          expected-plan-sha256: ${{ inputs.expected-plan-sha256 }}
          expected-import-map-sha256: ${{ inputs.expected-import-map-sha256 }}
          expires-at: ${{ inputs.expires-at }}
          authorization-id: ${{ inputs.authorization-id }}
          native-reviewers-available: ${{ inputs.native-reviewers-available }}
          job-workflow-ref: ${{ env.CENTRAL_WORKFLOW_REF }}

      - name: Controlled import into locked remote state
        if: ${{ inputs.mode == 'import' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          path = Path(os.environ["APPROVED_DIR"]) / "import-map.json"
          doc = json.loads(path.read_text())
          for item in doc["imports"]:
              subprocess.run(
                  ["tofu", "-chdir=infra/aws", "import", "-input=false", "-lock=true", item["address"], item["id"]],
                  check=True,
              )
          PY

      - name: Backup imported remote state object
        if: ${{ inputs.mode == 'import' }}
        run: |
          set -euo pipefail
          aws s3 cp "s3://${STATE_BUCKET}/${STATE_KEY}" "${STATE_EVIDENCE_DIR}/state-after.tfstate"
          sha256sum "${STATE_EVIDENCE_DIR}/state-after.tfstate" | awk '{print "STATE_AFTER_SHA256="$1}' | tee "${STATE_EVIDENCE_DIR}/state-after.sha256"
          aws s3 cp "s3://${STATE_BUCKET}/${STATE_KEY}" \
            "s3://${STATE_BUCKET}/backups/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/opentofu-after-import.tfstate"

      - name: Upload state evidence
        if: ${{ inputs.mode == 'import' }}
        uses: actions/upload-artifact@v4
        with:
          name: fieldzilla-staging-state-evidence-${{ inputs.expected-sha }}-${{ github.run_id }}
          path: ${{ env.STATE_EVIDENCE_DIR }}
          if-no-files-found: error
          overwrite: false
          retention-days: 1

      - name: Verify approved apply plan safety
        if: ${{ inputs.mode == 'apply' }}
        run: tofu -chdir=infra/aws show -json "${APPROVED_DIR}/fieldzilla-staging.tfplan" > "${RUNNER_TEMP}/approved-plan.json"

      - name: Gate approved apply plan
        if: ${{ inputs.mode == 'apply' }}
        uses: Synergie-ITCI/.github/actions/opentofu-plan-authorizer@pr-qa-v1-rc122
        with:
          command: verify-plan-safety
          plan-json-path: ${{ runner.temp }}/approved-plan.json
          plan-kind: normal

      - name: Mark apply authorization used
        if: ${{ inputs.mode == 'apply' }}
        env:
          GH_TOKEN: ${{ github.token }}
        uses: Synergie-ITCI/.github/actions/opentofu-plan-authorizer@pr-qa-v1-rc122
        with:
          command: mark-used
          actor: ${{ github.actor }}
          repository: ${{ github.repository }}
          environment: synergie-app-staging
          expected-sha: ${{ inputs.expected-sha }}
          github-sha: ${{ github.sha }}
          expected-plan-sha256: ${{ inputs.expected-plan-sha256 }}
          expected-import-map-sha256: ${{ inputs.expected-import-map-sha256 }}
          expires-at: ${{ inputs.expires-at }}
          authorization-id: ${{ inputs.authorization-id }}
          native-reviewers-available: ${{ inputs.native-reviewers-available }}
          job-workflow-ref: ${{ env.CENTRAL_WORKFLOW_REF }}

      - name: Apply exact approved plan artifact
        if: ${{ inputs.mode == 'apply' }}
        run: tofu -chdir=infra/aws apply -input=false -lock=true "${APPROVED_DIR}/fieldzilla-staging.tfplan"
