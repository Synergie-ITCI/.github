name: FieldZilla Staging OpenTofu Apply

on:
  workflow_call:
    inputs:
      expected-sha:
        description: Exact approved programme-management-platform commit SHA.
        required: true
        type: string
      expected-plan-sha256:
        description: Exact SHA-256 of the approved OpenTofu plan file.
        required: true
        type: string
      expires-at:
        description: ISO-8601 expiry, at most 60 minutes after approval.
        required: true
        type: string
      authorization-id:
        description: Single-use authorization id.
        required: true
        type: string
      native-reviewers-available:
        description: Must be false; native environment reviewers take precedence when available.
        required: true
        type: boolean
      apply:
        description: Apply the exact regenerated plan after all fallback checks pass.
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  deployments: write
  id-token: write

jobs:
  authorize-and-apply:
    name: Authorize Exact Plan
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected-sha }}
          persist-credentials: false

      - name: Checkout immutable central workflow tooling
        uses: actions/checkout@v4
        with:
          repository: Synergie-ITCI/.github
          ref: ${{ github.action_ref }}
          path: .synergie-governance
          persist-credentials: false

      - name: Validate fallback authorization
        env:
          JOB_WORKFLOW_REF: Synergie-ITCI/.github/.github/workflows/fieldzilla-staging-opentofu-apply.yml@${{ github.action_ref }}
        run: |
          python3 .synergie-governance/tools/opentofu_plan_authorization.py verify-inputs \
            --actor "${{ github.actor }}" \
            --repository "${{ github.repository }}" \
            --environment "synergie-app-staging" \
            --expected-sha "${{ inputs.expected-sha }}" \
            --github-sha "${{ github.sha }}" \
            --expected-plan-sha256 "${{ inputs.expected-plan-sha256 }}" \
            --expires-at "${{ inputs.expires-at }}" \
            --authorization-id "${{ inputs.authorization-id }}" \
            --native-reviewers-available "${{ inputs.native-reviewers-available }}" \
            --job-workflow-ref "${JOB_WORKFLOW_REF}"

      - name: Verify central workflow OIDC identity
        env:
          JOB_WORKFLOW_REF: Synergie-ITCI/.github/.github/workflows/fieldzilla-staging-opentofu-apply.yml@${{ github.action_ref }}
        run: |
          set -euo pipefail
          token_path="${RUNNER_TEMP}/fieldzilla-oidc.jwt"
          curl -fsSL \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' > "${token_path}"
          python3 .synergie-governance/tools/opentofu_plan_authorization.py verify-oidc \
            --token-file "${token_path}" \
            --job-workflow-ref "${JOB_WORKFLOW_REF}"
          rm -f "${token_path}"

      - name: Check authorization has not been used
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_WORKFLOW_REF: Synergie-ITCI/.github/.github/workflows/fieldzilla-staging-opentofu-apply.yml@${{ github.action_ref }}
        run: |
          python3 .synergie-governance/tools/opentofu_plan_authorization.py check-single-use \
            --actor "${{ github.actor }}" \
            --repository "${{ github.repository }}" \
            --environment "synergie-app-staging" \
            --expected-sha "${{ inputs.expected-sha }}" \
            --github-sha "${{ github.sha }}" \
            --expected-plan-sha256 "${{ inputs.expected-plan-sha256 }}" \
            --expires-at "${{ inputs.expires-at }}" \
            --authorization-id "${{ inputs.authorization-id }}" \
            --native-reviewers-available "${{ inputs.native-reviewers-available }}" \
            --job-workflow-ref "${JOB_WORKFLOW_REF}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::918870682888:role/SynergieProgrammeManagementPlatformStagingInfraApplyRole
          aws-region: ap-south-1

      - name: Regenerate exact OpenTofu plan
        run: |
          set -euo pipefail
          tofu -chdir=infra/aws init -backend=false
          tofu -chdir=infra/aws validate
          tofu -chdir=infra/aws plan -out="${RUNNER_TEMP}/fieldzilla-staging.tfplan"

      - name: Verify unchanged plan
        run: |
          python3 .synergie-governance/tools/opentofu_plan_authorization.py verify-plan \
            --plan-path "${RUNNER_TEMP}/fieldzilla-staging.tfplan" \
            --expected-plan-sha256 "${{ inputs.expected-plan-sha256 }}"

      - name: Mark authorization used
        if: ${{ inputs.apply }}
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_WORKFLOW_REF: Synergie-ITCI/.github/.github/workflows/fieldzilla-staging-opentofu-apply.yml@${{ github.action_ref }}
        run: |
          python3 .synergie-governance/tools/opentofu_plan_authorization.py mark-used \
            --actor "${{ github.actor }}" \
            --repository "${{ github.repository }}" \
            --environment "synergie-app-staging" \
            --expected-sha "${{ inputs.expected-sha }}" \
            --github-sha "${{ github.sha }}" \
            --expected-plan-sha256 "${{ inputs.expected-plan-sha256 }}" \
            --expires-at "${{ inputs.expires-at }}" \
            --authorization-id "${{ inputs.authorization-id }}" \
            --native-reviewers-available "${{ inputs.native-reviewers-available }}" \
            --job-workflow-ref "${JOB_WORKFLOW_REF}"

      - name: Apply exact reviewed plan
        if: ${{ inputs.apply }}
        run: tofu -chdir=infra/aws apply -input=false "${RUNNER_TEMP}/fieldzilla-staging.tfplan"
