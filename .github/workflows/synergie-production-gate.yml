name: Synergie Production Gate

on:
  workflow_call:
    inputs:
      governance-config-path:
        description: Repository governance configuration path.
        required: false
        type: string
        default: .github/synergie-governance.yml
      require-governance-config:
        description: Fail if the repository governance config is missing.
        required: false
        type: boolean
        default: false
      staging-branch:
        description: Approved staging/release-candidate source branch.
        required: false
        type: string
        default: staging
      production-branch:
        description: Production branch.
        required: false
        type: string
        default: main
      allowed-production-sources:
        description: Comma-separated branch patterns allowed to target production.
        required: false
        type: string
        default: staging
      enforce-promotion-path:
        description: Enforce staging to main promotion for PRs.
        required: false
        type: boolean
        default: true
      require-rollback-evidence:
        description: Require repository-provided rollback evidence for the release PR.
        required: false
        type: boolean
        default: false
      rollback-evidence-paths:
        description: Comma-separated paths that satisfy rollback evidence when required.
        required: false
        type: string
        default: docs/rollback.md,docs/release.md,runbooks/rollback.md,.github/rollback.md
      run-pr-qa:
        description: Run the central Synergie PR QA workflow after production preflight.
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: read

jobs:
  production-preflight:
    name: Production Release Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate production promotion path
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          GOVERNANCE_CONFIG_PATH: ${{ inputs.governance-config-path }}
          REQUIRE_GOVERNANCE_CONFIG: ${{ inputs.require-governance-config }}
          PRODUCTION_BRANCH: ${{ inputs.production-branch }}
          ALLOWED_PRODUCTION_SOURCES: ${{ inputs.allowed-production-sources }}
          ENFORCE_PROMOTION_PATH: ${{ inputs.enforce-promotion-path }}
          REQUIRE_ROLLBACK_EVIDENCE: ${{ inputs.require-rollback-evidence }}
          ROLLBACK_EVIDENCE_PATHS: ${{ inputs.rollback-evidence-paths }}
        run: |
          python3 - <<'PY'
          from fnmatch import fnmatchcase
          from pathlib import Path
          import os
          import sys

          event_name = os.environ.get("EVENT_NAME", "")
          base_ref = os.environ.get("BASE_REF", "")
          head_ref = os.environ.get("HEAD_REF", "")
          config_path = Path(os.environ["GOVERNANCE_CONFIG_PATH"])
          require_config = os.environ["REQUIRE_GOVERNANCE_CONFIG"].lower() == "true"
          enforce_path = os.environ["ENFORCE_PROMOTION_PATH"].lower() == "true"
          production_branch = os.environ["PRODUCTION_BRANCH"]
          allowed_sources = [
              item.strip()
              for item in os.environ["ALLOWED_PRODUCTION_SOURCES"].split(",")
              if item.strip()
          ]
          require_rollback = os.environ["REQUIRE_ROLLBACK_EVIDENCE"].lower() == "true"
          rollback_paths = [
              Path(item.strip())
              for item in os.environ["ROLLBACK_EVIDENCE_PATHS"].split(",")
              if item.strip()
          ]

          if require_config and not config_path.exists():
              print(f"Missing required governance config: {config_path}", file=sys.stderr)
              sys.exit(1)

          if config_path.exists():
              text = config_path.read_text(encoding="utf-8", errors="replace")
              lowered = text.lower()
              forbidden = [
                  "password:",
                  "secret:",
                  "access_key",
                  "private_key",
                  "token:",
                  "credential",
              ]
              matched = [item for item in forbidden if item in lowered]
              if matched:
                  print(
                      f"Governance config must not contain credentials or secrets. Matched: {', '.join(matched)}",
                      file=sys.stderr,
                  )
                  sys.exit(1)
              print(f"Governance config present: {config_path}")
          else:
              print(f"Governance config not present: {config_path} (allowed by workflow input)")

          if require_rollback and not any(path.exists() for path in rollback_paths):
              print(
                  "Rollback evidence is required but none of the configured paths exist: "
                  + ", ".join(str(path) for path in rollback_paths),
                  file=sys.stderr,
              )
              sys.exit(1)

          if event_name != "pull_request" or not enforce_path:
              print("Production promotion path enforcement skipped for this event/input.")
              sys.exit(0)

          if base_ref == production_branch:
              if not any(fnmatchcase(head_ref, pattern) for pattern in allowed_sources):
                  print(
                      "Invalid production promotion source. "
                      f"base={base_ref!r}, head={head_ref!r}, allowed={allowed_sources!r}",
                      file=sys.stderr,
                  )
                  sys.exit(1)
              print(f"Production promotion source accepted: {head_ref} -> {base_ref}")
          else:
              print(f"No production promotion rule applies to base branch: {base_ref}")
          PY

  pr-qa:
    name: Synergie Release QA
    needs: production-preflight
    if: ${{ inputs.run-pr-qa }}
    uses: Synergie-ITCI/.github/.github/workflows/pr-qa.yml@main
