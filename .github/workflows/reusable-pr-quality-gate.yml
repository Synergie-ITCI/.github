name: Reusable PR Quality Gate

on:
  workflow_call:
    inputs:
      config-path:
        description: Repository-level PR QA config path.
        required: false
        type: string
        default: .github/pr-qa.yml
      large-file-threshold-mb:
        description: Warn when changed files exceed this size.
        required: false
        type: string
        default: "10"
      fail-on-dependency-vulnerabilities:
        description: Fail dependency audits instead of reporting warnings.
        required: false
        type: boolean
        default: false
      evidence-enforcement:
        description: Whether missing PR evidence fails the gate or only warns.
        required: false
        type: string
        default: fail
      repository-criticality:
        description: low, medium, high, or critical. Used by the risk engine.
        required: false
        type: string
        default: medium
      max-changed-files-for-low-risk:
        description: Changed file count allowed before PR size increases risk.
        required: false
        type: string
        default: "20"

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  quality-gate:
    name: PR Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Synergie QA tooling
        uses: actions/checkout@v4
        with:
          repository: Synergie-ITCI/.github
          ref: main
          path: .synergie-pr-qa
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Setup .NET
        if: ${{ hashFiles('*.sln', '**/*.csproj') != '' }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gitleaks
        continue-on-error: true
        run: |
          version="8.24.3"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

      - name: Run Synergie PR QA
        id: qa
        continue-on-error: true
        env:
          PR_QA_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_QA_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_QA_CONFIG_PATH: ${{ inputs.config-path }}
          PR_QA_LARGE_FILE_THRESHOLD_MB: ${{ inputs.large-file-threshold-mb }}
          PR_QA_FAIL_ON_DEPENDENCY_VULNERABILITIES: ${{ inputs.fail-on-dependency-vulnerabilities }}
          PR_QA_EVIDENCE_ENFORCEMENT: ${{ inputs.evidence-enforcement }}
          PR_QA_REPOSITORY_CRITICALITY: ${{ inputs.repository-criticality }}
          PR_QA_MAX_CHANGED_FILES_FOR_LOW_RISK: ${{ inputs.max-changed-files-for-low-risk }}
        run: |
          python .synergie-pr-qa/tools/pr_qa_gate.py

      - name: Publish job summary
        if: always()
        run: |
          if [ -f pr-qa-report.md ]; then
            cat pr-qa-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "PR QA report was not generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Comment PR summary
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- synergie-pr-qa-report -->';
            const report = fs.existsSync('pr-qa-report.md')
              ? fs.readFileSync('pr-qa-report.md', 'utf8')
              : `${marker}\nPR QA report was not generated.`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) =>
              comment.user.type === 'Bot' && comment.body && comment.body.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body: report,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: report,
              });
            }

      - name: Upload PR QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-quality-gate-report
          path: |
            pr-qa-report.md
            pr-qa-result.json
          if-no-files-found: warn

      - name: Enforce PR QA result
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("pr-qa-result.json")
          if not path.exists():
              raise SystemExit("PR QA result file was not generated.")

          result = json.loads(path.read_text())
          if result.get("overall") != "PASS":
              raise SystemExit("PR Quality Gate failed. See report summary and annotations.")
          print("PR Quality Gate passed.")
          PY
