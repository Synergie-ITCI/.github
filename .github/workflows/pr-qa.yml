name: Synergie PR QA

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: read

env:
  PR_QA_COMMAND_TIMEOUT_MINUTES: "20"
  PYTHONDONTWRITEBYTECODE: "1"
  GITLEAKS_VERSION: "8.30.1"
  OPENTOFU_VERSION: "1.12.5"
  TFSEC_VERSION: "1.28.14"
  PR_QA_FRAMEWORK_RELEASE: "pr-qa-v1-rc36"

jobs:
  detect:
    name: Detect repository technologies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      technologies: ${{ steps.detect.outputs.technologies }}
      php: ${{ steps.detect.outputs.php }}
      node: ${{ steps.detect.outputs.node }}
      python: ${{ steps.detect.outputs.python }}
      go: ${{ steps.detect.outputs.go }}
      gradle: ${{ steps.detect.outputs.gradle }}
      java: ${{ steps.detect.outputs.java }}
      dotnet: ${{ steps.detect.outputs.dotnet }}
      rust: ${{ steps.detect.outputs.rust }}
      swift: ${{ steps.detect.outputs.swift }}
      shell: ${{ steps.detect.outputs.shell }}
      terraform: ${{ steps.detect.outputs.terraform }}
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch current pull request base branch
        if: github.event_name == 'pull_request' && github.event.pull_request.base.ref != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          auth_header="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth_header}" \
            fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"

      - name: Prepare local central PR QA framework
        if: github.repository == 'Synergie-ITCI/.github'
        run: |
          mkdir -p .pr-qa-framework
          rsync -a --exclude='.git' --exclude='.pr-qa-framework' ./ .pr-qa-framework/

      - name: Checkout immutable central PR QA framework
        if: github.repository != 'Synergie-ITCI/.github'
        uses: actions/checkout@v4
        with:
          repository: Synergie-ITCI/.github
          ref: ${{ env.PR_QA_FRAMEWORK_RELEASE }}
          path: .pr-qa-framework
          persist-credentials: false

      - name: Detect technologies
        id: detect
        run: |
          python3 .pr-qa-framework/pr-qa/pr_qa.py \
            --repo "$GITHUB_WORKSPACE" \
            --detect-only \
            --github-output "$GITHUB_OUTPUT"

  qa:
    name: Pull Request Quality Assurance
    runs-on: ubuntu-latest
    needs: detect
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: telepathy_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d telepathy_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch current pull request base branch
        if: github.event_name == 'pull_request' && github.event.pull_request.base.ref != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          auth_header="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth_header}" \
            fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"

      - name: Prepare local central PR QA framework
        if: github.repository == 'Synergie-ITCI/.github'
        run: |
          mkdir -p .pr-qa-framework
          rsync -a --exclude='.git' --exclude='.pr-qa-framework' ./ .pr-qa-framework/

      - name: Checkout immutable central PR QA framework
        if: github.repository != 'Synergie-ITCI/.github'
        uses: actions/checkout@v4
        with:
          repository: Synergie-ITCI/.github
          ref: ${{ env.PR_QA_FRAMEWORK_RELEASE }}
          path: .pr-qa-framework
          persist-credentials: false

      - name: Install mandatory Gitleaks
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Phase 1 static preflight
        id: static
        run: |
          mkdir -p pr-qa-results
          profile_args=()
          if [ "${GITHUB_REPOSITORY}" = "Synergie-ITCI/.github" ]; then
            profile_args=(--repository-profile framework)
          fi
          set +e
          python3 .pr-qa-framework/pr-qa/pr_qa.py \
            --repo "$GITHUB_WORKSPACE" \
            --static-only \
            --out pr-qa-results/pr-quality-report.md \
            --json-out pr-qa-results/pr-quality-report.json \
            --command-timeout-minutes "$PR_QA_COMMAND_TIMEOUT_MINUTES" \
            "${profile_args[@]}"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish Phase 1 report
        if: always()
        run: |
          if [ -f pr-qa-results/pr-quality-report.md ]; then
            cat pr-qa-results/pr-quality-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "# PR QUALITY REPORT"
              echo ""
              echo "FAIL: Phase 1 report was not generated."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Phase 1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-qa-phase-1-results
          path: pr-qa-results/
          retention-days: 30

      - name: Enforce Phase 1 static preflight
        if: steps.static.outputs.exit_code != '0'
        run: exit 1

      - name: Resolve Node.js version
        id: node-version
        if: needs.detect.outputs.node == 'true'
        run: |
          python3 .pr-qa-framework/pr-qa/resolve_node_version.py "$GITHUB_WORKSPACE" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        if: needs.detect.outputs.node == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node-version.outputs.node-version }}

      - name: Resolve PHP version
        id: php-version
        if: needs.detect.outputs.php == 'true'
        run: |
          python3 .pr-qa-framework/pr-qa/resolve_php_version.py "$GITHUB_WORKSPACE" >> "$GITHUB_OUTPUT"

      - name: Set up PHP
        if: needs.detect.outputs.php == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ steps.php-version.outputs.php-version }}
          tools: composer
          coverage: none

      - name: Set up Python
        if: needs.detect.outputs.python == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install mandatory Python QA tools
        if: needs.detect.outputs.python == 'true'
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pytest pip-audit
          python -m pytest --version
          pip-audit --version

      - name: Set up Go
        if: needs.detect.outputs.go == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Set up Java
        if: needs.detect.outputs.gradle == 'true' || needs.detect.outputs.java == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up OpenTofu
        if: needs.detect.outputs.terraform == 'true'
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.OPENTOFU_VERSION }}
          tofu_wrapper: false

      - name: Install mandatory Terraform security scanner
        if: needs.detect.outputs.terraform == 'true'
        run: |
          set -euo pipefail
          asset="tfsec_${TFSEC_VERSION}_linux_amd64.tar.gz"
          curl -sSfL "https://github.com/aquasecurity/tfsec/releases/download/v${TFSEC_VERSION}/${asset}" -o "/tmp/${asset}"
          curl -sSfL "https://github.com/aquasecurity/tfsec/releases/download/v${TFSEC_VERSION}/tfsec_${TFSEC_VERSION}_checksums.txt" -o /tmp/tfsec-checksums.txt
          grep " ${asset}$" /tmp/tfsec-checksums.txt > /tmp/tfsec.sha256
          (cd /tmp && sha256sum -c /tmp/tfsec.sha256)
          tar -xzf "/tmp/${asset}" -C /tmp tfsec
          sudo install -m 0755 /tmp/tfsec /usr/local/bin/tfsec
          tfsec --version

      - name: Set up .NET
        if: needs.detect.outputs.dotnet == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Prepare PostgreSQL test database
        if: needs.detect.outputs.php == 'true'
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U postgres -d telepathy_test -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'runner') THEN
              CREATE ROLE runner LOGIN;
            END IF;
          END
          $$;
          ALTER DATABASE telepathy_test OWNER TO runner;
          GRANT ALL PRIVILEGES ON DATABASE telepathy_test TO runner;
          SQL

      - name: Phase 2 and Phase 3 validation
        id: full
        run: |
          rm -rf pr-qa-results
          mkdir -p pr-qa-results
          profile_args=()
          if [ "${GITHUB_REPOSITORY}" = "Synergie-ITCI/.github" ]; then
            profile_args=(--repository-profile framework)
          fi
          set +e
          python3 .pr-qa-framework/pr-qa/pr_qa.py \
            --repo "$GITHUB_WORKSPACE" \
            --out pr-qa-results/pr-quality-report.md \
            --json-out pr-qa-results/pr-quality-report.json \
            --command-timeout-minutes "$PR_QA_COMMAND_TIMEOUT_MINUTES" \
            "${profile_args[@]}"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish final PR QA report
        if: always()
        run: |
          if [ -f pr-qa-results/pr-quality-report.md ]; then
            cat pr-qa-results/pr-quality-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "# PR QUALITY REPORT"
              echo ""
              echo "FAIL: final report was not generated."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload final PR QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-qa-results
          path: pr-qa-results/
          retention-days: 30

      - name: Enforce final PR QA result
        if: steps.full.outputs.exit_code != '0'
        run: exit 1
