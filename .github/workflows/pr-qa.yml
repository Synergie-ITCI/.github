name: Synergie PR QA

on:
  workflow_call:
    inputs:
      ai-review-provider:
        required: false
        type: string
        default: codex
      ai-review-model:
        required: false
        type: string
        default: codex-review-v1
      repository-profile:
        required: false
        type: string
        default: ""
    secrets:
      AI_REVIEW_PROVIDER_URL:
        required: false
      AI_REVIEW_PROVIDER_TOKEN:
        required: false

permissions:
  contents: read

env:
  PR_QA_COMMAND_TIMEOUT_MINUTES: "20"
  PR_QA_GITLEAKS_LINUX_X64_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  PR_QA_GITLEAKS_VERSION: "8.30.1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  detect:
    name: Detect repository technologies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      technologies: ${{ steps.detect.outputs.technologies }}
      php: ${{ steps.detect.outputs.php }}
      node: ${{ steps.detect.outputs.node }}
      python: ${{ steps.detect.outputs.python }}
      go: ${{ steps.detect.outputs.go }}
      gradle: ${{ steps.detect.outputs.gradle }}
      java: ${{ steps.detect.outputs.java }}
      dotnet: ${{ steps.detect.outputs.dotnet }}
      rust: ${{ steps.detect.outputs.rust }}
      swift: ${{ steps.detect.outputs.swift }}
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Checkout immutable central PR QA framework
        uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .pr-qa-framework
          persist-credentials: false

      - name: Detect technologies
        id: detect
        run: |
          python3 .pr-qa-framework/pr-qa/pr_qa.py \
            --repo "$GITHUB_WORKSPACE" \
            --detect-only \
            --github-output "$GITHUB_OUTPUT"

  qa:
    name: Pull Request Quality Assurance
    runs-on: ubuntu-latest
    needs: detect
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      static_exit_code: ${{ steps.static.outputs.exit_code }}
      full_exit_code: ${{ steps.full.outputs.exit_code }}
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Checkout immutable central PR QA framework
        uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .pr-qa-framework
          persist-credentials: false

      - name: Install mandatory Gitleaks
        run: |
          curl -fsSL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${PR_QA_GITLEAKS_VERSION}/gitleaks_${PR_QA_GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          echo "${PR_QA_GITLEAKS_LINUX_X64_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf /tmp/gitleaks.tar.gz -C "$HOME/.local/bin" gitleaks
          chmod 0755 "$HOME/.local/bin/gitleaks"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/gitleaks" version

      - name: Phase 1 static preflight
        id: static
        run: |
          mkdir -p pr-qa-results
          set +e
          python3 .pr-qa-framework/pr-qa/pr_qa.py \
            --repo "$GITHUB_WORKSPACE" \
            --static-only \
            --repository-profile "${{ inputs.repository-profile }}" \
            --out pr-qa-results/pr-quality-report.md \
            --json-out pr-qa-results/pr-quality-report.json \
            --command-timeout-minutes "$PR_QA_COMMAND_TIMEOUT_MINUTES"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish Phase 1 report
        if: always()
        run: |
          if [ -f pr-qa-results/pr-quality-report.md ]; then
            cat pr-qa-results/pr-quality-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "# PR QUALITY REPORT"
              echo ""
              echo "FAIL: Phase 1 report was not generated."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Phase 1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-qa-phase-1-results
          path: |
            pr-qa-results/pr-quality-report.md
            pr-qa-results/pr-quality-report.json
            pr-qa-results/gitleaks.json
            pr-qa-results/emergency-override-audit.json
          retention-days: 30

      - name: Enforce Phase 1 static preflight
        if: steps.static.outputs.exit_code != '0'
        run: exit 1

      - name: Set up Node.js
        if: needs.detect.outputs.node == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up PHP
        if: needs.detect.outputs.php == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer
          coverage: none

      - name: Set up Python
        if: needs.detect.outputs.python == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Go
        if: needs.detect.outputs.go == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Set up Java
        if: needs.detect.outputs.gradle == 'true' || needs.detect.outputs.java == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up .NET
        if: needs.detect.outputs.dotnet == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Phase 2 and Phase 3 validation
        id: full
        run: |
          rm -rf pr-qa-results
          mkdir -p pr-qa-results
          set +e
          python3 .pr-qa-framework/pr-qa/pr_qa.py \
            --repo "$GITHUB_WORKSPACE" \
            --repository-profile "${{ inputs.repository-profile }}" \
            --out pr-qa-results/pr-quality-report.md \
            --json-out pr-qa-results/pr-quality-report.json \
            --command-timeout-minutes "$PR_QA_COMMAND_TIMEOUT_MINUTES"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish final PR QA report
        if: always()
        run: |
          if [ -f pr-qa-results/pr-quality-report.md ]; then
            cat pr-qa-results/pr-quality-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "# PR QUALITY REPORT"
              echo ""
              echo "FAIL: final report was not generated."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload final PR QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-qa-results
          path: |
            pr-qa-results/pr-quality-report.md
            pr-qa-results/pr-quality-report.json
            pr-qa-results/gitleaks.json
            pr-qa-results/emergency-override-audit.json
          retention-days: 30

      - name: Enforce final PR QA result
        if: steps.full.outputs.exit_code != '0'
        run: exit 1

  publisher:
    name: Publish Pull Request Review Evidence
    runs-on: ubuntu-latest
    needs: qa
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.draft == false && needs.qa.result != 'cancelled'
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout immutable central PR QA framework
        uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .pr-qa-framework
          persist-credentials: false

      - name: Download final PR QA evidence
        id: download-final
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: pr-qa-results
          path: trusted-evidence/final

      - name: Download Phase 1 PR QA evidence
        id: download-phase-1
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: pr-qa-phase-1-results
          path: trusted-evidence/phase-1

      - name: Select authoritative QA evidence
        id: evidence
        run: |
          if [ -f trusted-evidence/final/pr-quality-report.json ]; then
            echo "report_json=trusted-evidence/final/pr-quality-report.json" >> "$GITHUB_OUTPUT"
            echo "source=final" >> "$GITHUB_OUTPUT"
          elif [ -f trusted-evidence/phase-1/pr-quality-report.json ]; then
            echo "report_json=trusted-evidence/phase-1/pr-quality-report.json" >> "$GITHUB_OUTPUT"
            echo "source=phase-1" >> "$GITHUB_OUTPUT"
          else
            echo "report_json=" >> "$GITHUB_OUTPUT"
            echo "source=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish inline PR QA comments
        if: steps.evidence.outputs.report_json != ''
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 .pr-qa-framework/pr-qa/review_comments.py \
            --event-path "$GITHUB_EVENT_PATH" \
            --report-json "${{ steps.evidence.outputs.report_json }}"

      - name: AI engineering review
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AI_REVIEW_PROVIDER: ${{ inputs.ai-review-provider }}
          AI_REVIEW_MODEL: ${{ inputs.ai-review-model }}
          AI_REVIEW_PROVIDER_URL: ${{ secrets.AI_REVIEW_PROVIDER_URL }}
          AI_REVIEW_PROVIDER_TOKEN: ${{ secrets.AI_REVIEW_PROVIDER_TOKEN }}
          AI_REVIEW_APPROVED_HOSTS: ${{ vars.AI_REVIEW_APPROVED_HOSTS }}
          AI_REVIEW_APPROVED_INTERNAL_HOSTS: ${{ vars.AI_REVIEW_APPROVED_INTERNAL_HOSTS }}
        run: |
          mkdir -p pr-qa-results
          python3 .pr-qa-framework/pr-qa/ai_review.py \
            --repo "$GITHUB_WORKSPACE" \
            --event-path "$GITHUB_EVENT_PATH" \
            --qa-report-json "${{ steps.evidence.outputs.report_json }}" \
            --out pr-qa-results/ai-review-report.md \
            --json-out pr-qa-results/ai-review-report.json \
            --publish-comments
          if [ -f pr-qa-results/ai-review-report.md ]; then
            cat pr-qa-results/ai-review-report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload publisher evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-qa-ai-review-results
          path: pr-qa-results/
          retention-days: 30
