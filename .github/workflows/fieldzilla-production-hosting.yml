name: FieldZilla Production Hosting

on:
  workflow_call:
    inputs:
      mode:
        required: true
        type: string
      target:
        required: false
        type: string
        default: production
      expires-at:
        required: false
        type: string
      resource-expires-at:
        required: false
        type: string
      phase:
        required: true
        type: string
      source-sha:
        required: true
        type: string
      caller-sha:
        required: true
        type: string
      workflow-tag:
        required: true
        type: string
      plan-run-id:
        required: false
        type: string
      artifact-id:
        required: false
        type: string
      artifact-name:
        required: false
        type: string
      artifact-digest:
        required: false
        type: string
      plan-sha256:
        required: false
        type: string
      approval-comment-id:
        required: false
        type: string

permissions:
  actions: read
  contents: read
  deployments: write
  id-token: write
  issues: read
  pull-requests: read

concurrency:
  group: fieldzilla-production-hosting
  cancel-in-progress: false

jobs:
  hosting:
    runs-on: ubuntu-latest
    environment: synergie-app-production
    timeout-minutes: 45
    env:
      AWS_REGION: ap-south-1
      CENTRAL_WORKFLOW_REF: Synergie-ITCI/.github/.github/workflows/fieldzilla-production-hosting.yml@${{ inputs.workflow-tag }}
      ROOT: ${{ inputs.target == 'rehearsal' && 'deploy/production/hosting/rehearsal' || 'deploy/production/hosting' }}
      STATE_BUCKET: synergie-fieldzilla-opentofu-state-918870682888-ap-south-1
      STATE_KEY: ${{ inputs.target == 'rehearsal' && 'programme-management-platform/fieldzilla/production-rehearsal/opentofu.tfstate' || 'programme-management-platform/fieldzilla/production/hosting/opentofu.tfstate' }}
      STATE_LOCK_TABLE: synergie-fieldzilla-opentofu-locks
      ROLE_ARN: ${{ inputs.target == 'rehearsal' && 'arn:aws:iam::918870682888:role/SynergieFieldzillaProductionRehearsalInfrastructure' || 'arn:aws:iam::918870682888:role/SynergieFieldzillaProductionHostingOpenTofu' }}
      TARGET: ${{ inputs.target }}
      EXPIRES_AT: ${{ inputs.expires-at }}
      RESOURCE_EXPIRES_AT: ${{ inputs.resource-expires-at }}
      MODE: ${{ inputs.mode }}
      PHASE: ${{ inputs.phase }}
      SOURCE_SHA: ${{ inputs.source-sha }}
      CALLER_SHA: ${{ inputs.caller-sha }}
      WORKFLOW_TAG: ${{ inputs.workflow-tag }}
      PLAN_RUN_ID: ${{ inputs.plan-run-id }}
      ARTIFACT_ID: ${{ inputs.artifact-id }}
      ARTIFACT_NAME: ${{ inputs.artifact-name }}
      ARTIFACT_DIGEST: ${{ inputs.artifact-digest }}
      PLAN_SHA256: ${{ inputs.plan-sha256 }}
      APPROVAL_COMMENT_ID: ${{ inputs.approval-comment-id }}
    steps:
      - name: Verify call contract
        env:
          MODE: ${{ inputs.mode }}
          PHASE: ${{ inputs.phase }}
          SOURCE_SHA: ${{ inputs.source-sha }}
          CALLER_SHA: ${{ inputs.caller-sha }}
        run: |
          set -euo pipefail
          [ "${GITHUB_REPOSITORY}" = "Synergie-ITCI/programme-management-platform" ]
          [ "${GITHUB_REF}" = "refs/heads/main" ]
          [ "${GITHUB_SHA}" = "${CALLER_SHA}" ]
          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${CALLER_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${MODE}" =~ ^(probe|plan|apply)$ ]]
          [[ "${PHASE}" =~ ^(phase1|phase2|production-bootstrap|production-network-repair|production-routing|cleanup-protection|cleanup-destroy|cleanup-partial|cleanup-interrupted|cleanup-kms-residual)$ ]]
          [[ "${TARGET}" =~ ^(production|rehearsal)$ ]]
          if [ "${TARGET}" = rehearsal ]; then
            [ "${PHASE}" != phase2 ]
            [[ "${EXPIRES_AT}" =~ ^20[0-9]{2}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]
            if [ "${PHASE}" != phase1 ]; then
              [[ "${RESOURCE_EXPIRES_AT}" =~ ^20[0-9]{2}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]
            fi
          else
            [[ "${PHASE}" =~ ^(phase1|phase2|production-bootstrap|production-network-repair|production-routing)$ ]]
          fi

      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify source is in protected caller commit
        env:
          CALLER_SHA: ${{ inputs.caller-sha }}
          SOURCE_SHA: ${{ inputs.source-sha }}
        run: |
          set -euo pipefail
          git cat-file -e "${CALLER_SHA}^{commit}"
          git merge-base --is-ancestor "${SOURCE_SHA}" "${CALLER_SHA}"
          test -f "${ROOT}/backend.hcl"

      - name: Checkout exact central workflow release
        uses: actions/checkout@v4
        with:
          repository: Synergie-ITCI/.github
          ref: ${{ inputs.workflow-tag }}
          path: .central-framework
          persist-credentials: false

      - name: Verify central workflow identity
        env:
          EXPECTED_TAG: ${{ inputs.workflow-tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "${EXPECTED_TAG}" =~ ^refs/tags/pr-qa-v1-rc[0-9]+$ ]]
          test -f .central-framework/actions/fieldzilla-production-hosting/authorize.py
          actual="$(git -C .central-framework rev-parse HEAD)"
          test -n "${actual}"
          if [ "${TARGET}" = rehearsal ]; then
            python3 .central-framework/pr-qa/release_pin.py --verify-bound "${EXPECTED_TAG#refs/tags/}" --commit "${actual}"
          fi

      - name: Verify hosting PR comment read access
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${MODE}" = probe ]; then
            python3 .central-framework/actions/fieldzilla-production-hosting/authorize.py probe \
              --source-sha "${SOURCE_SHA}" --caller-sha "${CALLER_SHA}" \
              --workflow-tag "${WORKFLOW_TAG}" --phase "${PHASE}" \
              --target "${TARGET}" --expires-at "${EXPIRES_AT}" \
              --resource-expires-at "${RESOURCE_EXPIRES_AT}" \
              --approval-comment-id "${APPROVAL_COMMENT_ID}"
          else
            if [ "${TARGET}" = rehearsal ]; then
              gh api "repos/${GITHUB_REPOSITORY}/issues/717/comments?per_page=1" --silent
            else
              gh api "repos/${GITHUB_REPOSITORY}/issues/674/comments?per_page=1" --silent
            fi
          fi

      - name: Verify GitHub OIDC production identity
        env:
          EXPECTED_CALLER_SHA: ${{ inputs.caller-sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, urllib.parse, urllib.request
          url = os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']
          url += ('&' if '?' in url else '?') + urllib.parse.urlencode({'audience':'sts.amazonaws.com'})
          req = urllib.request.Request(url, headers={'Authorization':'Bearer '+os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
          with urllib.request.urlopen(req, timeout=20) as response:
              token = json.load(response)['value']
          payload = token.split('.')[1]
          claims = json.loads(base64.urlsafe_b64decode(payload + '=' * (-len(payload) % 4)))
          required = {
              'aud':'sts.amazonaws.com',
              'repository':'Synergie-ITCI/programme-management-platform',
              'repository_id':'1315697868',
              'repository_owner_id':'209829096',
              'environment':'synergie-app-production',
              'sub':'repo:Synergie-ITCI@209829096/programme-management-platform@1315697868:environment:synergie-app-production',
              'ref':'refs/heads/main',
              'sha':os.environ['EXPECTED_CALLER_SHA'],
              'job_workflow_ref':os.environ['CENTRAL_WORKFLOW_REF'],
          }
          mismatches = [key for key,value in required.items() if str(claims.get(key)) != value]
          if mismatches:
              raise SystemExit('GitHub OIDC claim mismatch in: ' + ', '.join(mismatches))
          print('GitHub OIDC production identity verified')
          PY

      - name: Configure exact target AWS role
        if: ${{ inputs.mode != 'probe' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS account and state controls
        if: ${{ inputs.mode != 'probe' }}
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = 918870682888
          test "$(aws s3api get-bucket-versioning --bucket "${STATE_BUCKET}" --query Status --output text)" = Enabled
          test "$(aws s3api get-bucket-encryption --bucket "${STATE_BUCKET}" --query 'ServerSideEncryptionConfiguration.Rules[0].ApplyServerSideEncryptionByDefault.SSEAlgorithm' --output text)" = aws:kms
          aws dynamodb describe-table --table-name "${STATE_LOCK_TABLE}" --query Table.TableStatus --output text | grep -qx ACTIVE

      - name: Verify isolated rehearsal bootstrap identities and log sink
        if: ${{ inputs.mode != 'probe' && inputs.target == 'rehearsal' }}
        run: |
          set -euo pipefail
          bootstrap="${ROOT}/bootstrap"
          aws iam get-role --role-name SynergieFieldzillaProductionRehearsalInfrastructure \
            --query Role.AssumeRolePolicyDocument --output json > "${RUNNER_TEMP}/rehearsal-trust.json"
          aws s3api get-bucket-policy \
            --bucket fz-logs-918870682888-20260912185212322100000003 \
            --query Policy --output text > "${RUNNER_TEMP}/rehearsal-log-sink.json"
          python3 .central-framework/actions/fieldzilla-production-hosting/verify_bootstrap.py \
            "${bootstrap}" "${RUNNER_TEMP}" "${CENTRAL_WORKFLOW_REF}"

      - name: Require isolated application shutdown before cleanup planning
        if: ${{ inputs.mode != 'probe' && inputs.target == 'rehearsal' && inputs.phase != 'phase1' }}
        run: |
          set -euo pipefail
          if [ "${PHASE}" = cleanup-partial ] || [ "${PHASE}" = cleanup-interrupted ] || [ "${PHASE}" = cleanup-kms-residual ]; then
            aws ecs describe-clusters --clusters fieldzilla-production-rehearsal --output json |
              python3 -c 'import json,sys; d=json.load(sys.stdin); f=d.get("failures") or []; sys.exit(0 if d.get("clusters")==[] and len(f)==1 and f[0].get("arn")=="arn:aws:ecs:ap-south-1:918870682888:cluster/fieldzilla-production-rehearsal" and f[0].get("reason")=="MISSING" else 1)'
            if [ "${PHASE}" = cleanup-partial ] || [ "${PHASE}" = cleanup-kms-residual ]; then
              # The earlier six-role residual state has no bucket.
              if aws s3api list-object-versions --bucket syn-fz-rehearsal-attachments-918870682888-aps1 --output json > "${RUNNER_TEMP}/rehearsal-bucket.json" 2> "${RUNNER_TEMP}/rehearsal-bucket.err"; then
                echo "Residual cleanup requires the isolated attachment bucket to be absent" >&2
                exit 1
              fi
              grep -Fq 'NoSuchBucket' "${RUNNER_TEMP}/rehearsal-bucket.err"
            else
              # The interrupted serial-29 state owns this bucket; it must be empty.
              aws s3api list-object-versions --bucket syn-fz-rehearsal-attachments-918870682888-aps1 --output json |
                python3 -c 'import json,sys; d=json.load(sys.stdin); sys.exit(1 if d.get("Versions") or d.get("DeleteMarkers") else 0)'
            fi
          else
            test "$(aws ecs list-services --cluster fieldzilla-production-rehearsal --query 'length(serviceArns)' --output text)" = 0
            test "$(aws ecs list-tasks --cluster fieldzilla-production-rehearsal --query 'length(taskArns)' --output text)" = 0
            aws s3api list-object-versions --bucket syn-fz-rehearsal-attachments-918870682888-aps1 --output json |
              python3 -c 'import json,sys; d=json.load(sys.stdin); sys.exit(1 if d.get("Versions") or d.get("DeleteMarkers") else 0)'
          fi

      - name: Verify certificate issued for phase two
        if: ${{ inputs.mode != 'probe' && inputs.target == 'production' && (inputs.phase == 'phase2' || inputs.phase == 'production-bootstrap' || inputs.phase == 'production-network-repair' || inputs.phase == 'production-routing') }}
        run: |
          set -euo pipefail
          arn="$(aws acm list-certificates --certificate-statuses ISSUED --query "CertificateSummaryList[?DomainName=='fieldzilla.synergieinsights.in'].CertificateArn | [0]" --output text)"
          test "${arn}" != None
          test -n "${arn}"

      - name: Set up OpenTofu
        if: ${{ inputs.mode != 'probe' }}
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.12.5
          tofu_wrapper: false

      - name: Download exact approved plan
        if: ${{ inputs.mode == 'apply' }}
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ inputs.artifact-id }}
          path: ${{ runner.temp }}/approved
          github-token: ${{ github.token }}
          repository: Synergie-ITCI/programme-management-platform
          run-id: ${{ inputs.plan-run-id }}
          merge-multiple: true

      - name: Initialize production-only state
        if: ${{ inputs.mode != 'probe' }}
        run: |
          set -euo pipefail
          grep -Fqx "bucket         = \"${STATE_BUCKET}\"" "${ROOT}/backend.hcl"
          grep -Fqx "key            = \"${STATE_KEY}\"" "${ROOT}/backend.hcl"
          grep -Fqx "dynamodb_table = \"${STATE_LOCK_TABLE}\"" "${ROOT}/backend.hcl"
          grep -Fqx 'encrypt        = true' "${ROOT}/backend.hcl"
          grep -Fqx 'region         = "ap-south-1"' "${ROOT}/backend.hcl"
          tofu -chdir="${ROOT}" fmt -check
          if [ "${MODE}" = apply ]; then
            cp "${RUNNER_TEMP}/approved/.terraform.lock.hcl" "${ROOT}/.terraform.lock.hcl"
            tofu -chdir="${ROOT}" init -input=false -lockfile=readonly -backend-config=backend.hcl
          else
            tofu -chdir="${ROOT}" init -input=false -backend-config=backend.hcl
          fi
          tofu -chdir="${ROOT}" validate
          if [ "${TARGET}" = rehearsal ] && [ "${PHASE}" = cleanup-partial ]; then
            tofu -chdir="${ROOT}" state pull |
              python3 .central-framework/actions/fieldzilla-production-hosting/verify_partial_state.py "${SOURCE_SHA}" "${RESOURCE_EXPIRES_AT}"
          elif [ "${TARGET}" = rehearsal ] && [ "${PHASE}" = cleanup-interrupted ]; then
            state_version="$(aws s3api head-object --bucket "${STATE_BUCKET}" --key "${STATE_KEY}" --query VersionId --output text)"
            test "${state_version}" = nBarifpRPSS8L8B1sm5wVXIihLhhLneD
            tofu -chdir="${ROOT}" state pull |
              python3 .central-framework/actions/fieldzilla-production-hosting/verify_interrupted_state.py "${SOURCE_SHA}" "${RESOURCE_EXPIRES_AT}"
          elif [ "${TARGET}" = rehearsal ] && [ "${PHASE}" = cleanup-kms-residual ]; then
            state_version="$(aws s3api head-object --bucket "${STATE_BUCKET}" --key "${STATE_KEY}" --query VersionId --output text)"
            test "${state_version}" = _5D8ll2jFTMW0Nflg9u3UACnTsLaHoCx
            tofu -chdir="${ROOT}" state pull |
              python3 .central-framework/actions/fieldzilla-production-hosting/verify_kms_residual_state.py "${SOURCE_SHA}" "${RESOURCE_EXPIRES_AT}"
          elif [ "${TARGET}" = rehearsal ] && [ "${PHASE}" != phase1 ]; then
            tofu -chdir="${ROOT}" output -json target |
              python3 -c 'import json,os,sys; d=json.load(sys.stdin); sys.exit(0 if d["source_sha"] == os.environ["SOURCE_SHA"] and d["expires_at"] == os.environ["RESOURCE_EXPIRES_AT"] else 1)'
          fi

      - name: Generate exact binary plan
        if: ${{ inputs.mode == 'plan' }}
        env:
          PHASE: ${{ inputs.phase }}
          SOURCE_SHA: ${{ inputs.source-sha }}
          CALLER_SHA: ${{ inputs.caller-sha }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/plan"
          if [ "${TARGET}" = rehearsal ]; then
            destroy=()
            cleanup=false
            resource_expiry="${EXPIRES_AT}"
            if [ "${PHASE}" != phase1 ]; then cleanup=true; fi
            if [ "${PHASE}" != phase1 ]; then resource_expiry="${RESOURCE_EXPIRES_AT}"; fi
            if [ "${PHASE}" = cleanup-destroy ] || [ "${PHASE}" = cleanup-partial ] || [ "${PHASE}" = cleanup-interrupted ] || [ "${PHASE}" = cleanup-kms-residual ]; then destroy=(-destroy); fi
            tofu -chdir="${ROOT}" plan -input=false -lock=true "${destroy[@]}" \
              -var="source_sha=${SOURCE_SHA}" -var="expires_at=${resource_expiry}" \
              -var="cleanup_requested=${cleanup}" -out="${RUNNER_TEMP}/plan/hosting.tfplan"
          else
            attach=false
            if [ "${PHASE}" = phase2 ] || [ "${PHASE}" = production-bootstrap ] || [ "${PHASE}" = production-network-repair ] || [ "${PHASE}" = production-routing ]; then attach=true; fi
            private_validation=false
            if [ "${PHASE}" = production-bootstrap ] || [ "${PHASE}" = production-network-repair ] || [ "${PHASE}" = production-routing ]; then private_validation=true; fi
            activate_application=false
            if [ "${PHASE}" = production-routing ]; then activate_application=true; fi
            tofu -chdir="${ROOT}" plan -input=false -lock=true \
              -var="attach_validated_certificate=${attach}" \
              -var="attach_private_validation_targets=${private_validation}" \
              -var="activate_application=${activate_application}" \
              -out="${RUNNER_TEMP}/plan/hosting.tfplan"
          fi
          tofu -chdir="${ROOT}" show -json "${RUNNER_TEMP}/plan/hosting.tfplan" > "${RUNNER_TEMP}/plan/hosting.plan.json"
          tofu -chdir="${ROOT}" show -no-color "${RUNNER_TEMP}/plan/hosting.tfplan" > "${RUNNER_TEMP}/plan/hosting.plan.txt"
          python3 .central-framework/actions/fieldzilla-production-hosting/authorize.py plan \
            --source-sha "${SOURCE_SHA}" --caller-sha "${CALLER_SHA}" \
            --workflow-tag "${WORKFLOW_TAG}" --phase "${PHASE}" \
            --target "${TARGET}" --expires-at "${EXPIRES_AT}" \
            --resource-expires-at "${RESOURCE_EXPIRES_AT}" \
            --plan-json "${RUNNER_TEMP}/plan/hosting.plan.json"
          cp "${ROOT}/.terraform.lock.hcl" "${RUNNER_TEMP}/plan/.terraform.lock.hcl"
          plan_sha="$(sha256sum "${RUNNER_TEMP}/plan/hosting.tfplan" | cut -d' ' -f1)"
          lock_sha="$(sha256sum "${RUNNER_TEMP}/plan/.terraform.lock.hcl" | cut -d' ' -f1)"
          SOURCE_SHA="${SOURCE_SHA}" CALLER_SHA="${CALLER_SHA}" PHASE="${PHASE}" PLAN_SHA="${plan_sha}" LOCK_SHA="${lock_sha}" python3 -c 'import json,os,pathlib; pathlib.Path(os.environ["RUNNER_TEMP"],"plan","metadata.json").write_text(json.dumps({"repository":os.environ["GITHUB_REPOSITORY"],"source_sha":os.environ["SOURCE_SHA"],"caller_sha":os.environ["CALLER_SHA"],"phase":os.environ["PHASE"],"target":os.environ["TARGET"],"expires_at":os.environ["EXPIRES_AT"],"resource_expires_at":os.environ["RESOURCE_EXPIRES_AT"],"state_key":os.environ["STATE_KEY"],"plan_sha256":os.environ["PLAN_SHA"],"provider_lock_sha256":os.environ["LOCK_SHA"]},sort_keys=True))'
          echo "Plan SHA-256: ${plan_sha}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload exact plan
        if: ${{ inputs.mode == 'plan' }}
        id: plan_upload
        uses: actions/upload-artifact@v4
        with:
          name: fieldzilla-${{ inputs.target }}-${{ inputs.phase }}-${{ inputs.source-sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/plan/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Prepare exact owner approval text
        if: ${{ inputs.mode == 'plan' }}
        env:
          UPLOADED_ARTIFACT_ID: ${{ steps.plan_upload.outputs.artifact-id }}
          UPLOADED_ARTIFACT_DIGEST: ${{ steps.plan_upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          [[ "${UPLOADED_ARTIFACT_DIGEST}" =~ ^[0-9a-f]{64}$ ]]
          plan_sha="$(sha256sum "${RUNNER_TEMP}/plan/hosting.tfplan" | cut -d' ' -f1)"
          mkdir -p "${RUNNER_TEMP}/owner-approval"
          python3 .central-framework/actions/fieldzilla-production-hosting/authorize.py approval-template \
            --source-sha "${SOURCE_SHA}" --caller-sha "${CALLER_SHA}" \
            --workflow-tag "${WORKFLOW_TAG}" --phase "${PHASE}" \
            --target "${TARGET}" --expires-at "${EXPIRES_AT}" \
            --resource-expires-at "${RESOURCE_EXPIRES_AT}" \
            --plan-run-id "${GITHUB_RUN_ID}" --artifact-id "${UPLOADED_ARTIFACT_ID}" \
            --artifact-digest "${UPLOADED_ARTIFACT_DIGEST}" --plan-sha256 "${plan_sha}" \
            --artifact-dir "${RUNNER_TEMP}/plan" \
            --template-output "${RUNNER_TEMP}/owner-approval/approval.txt"
          {
            echo '### Exact owner approval text'
            echo 'Review the plan artifact before posting this text as your own new, unedited comment.'
            echo "Target PR: Synergie-ITCI/programme-management-platform#$(if [ "${TARGET}" = rehearsal ]; then echo 717; else echo 674; fi)"
            echo '```text'
            cat "${RUNNER_TEMP}/owner-approval/approval.txt"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload owner approval text
        if: ${{ inputs.mode == 'plan' }}
        uses: actions/upload-artifact@v4
        with:
          name: fieldzilla-owner-approval-${{ inputs.target }}-${{ inputs.phase }}-${{ github.run_id }}
          path: ${{ runner.temp }}/owner-approval/approval.txt
          if-no-files-found: error
          retention-days: 1

      - name: Verify owner approval and exact plan
        if: ${{ inputs.mode == 'apply' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tofu -chdir="${ROOT}" show -json "${RUNNER_TEMP}/approved/hosting.tfplan" > "${RUNNER_TEMP}/approved/hosting.plan.rechecked.json"
          python3 .central-framework/actions/fieldzilla-production-hosting/authorize.py apply \
            --source-sha "${SOURCE_SHA}" --caller-sha "${CALLER_SHA}" \
            --workflow-tag "${WORKFLOW_TAG}" --phase "${PHASE}" \
            --target "${TARGET}" --expires-at "${EXPIRES_AT}" \
            --resource-expires-at "${RESOURCE_EXPIRES_AT}" \
            --plan-run-id "${PLAN_RUN_ID}" --artifact-id "${ARTIFACT_ID}" \
            --artifact-name "${ARTIFACT_NAME}" --artifact-digest "${ARTIFACT_DIGEST}" \
            --plan-sha256 "${PLAN_SHA256}" --artifact-dir "${RUNNER_TEMP}/approved" \
            --plan-json "${RUNNER_TEMP}/approved/hosting.plan.rechecked.json" \
            --approval-comment-id "${APPROVAL_COMMENT_ID}"

      - name: Consume one-time approval before mutation
        if: ${{ inputs.mode == 'apply' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 .central-framework/actions/fieldzilla-production-hosting/authorize.py consume \
            --source-sha "${SOURCE_SHA}" --caller-sha "${CALLER_SHA}" \
            --workflow-tag "${WORKFLOW_TAG}" --phase "${PHASE}" \
            --target "${TARGET}" --expires-at "${EXPIRES_AT}" \
            --resource-expires-at "${RESOURCE_EXPIRES_AT}" \
            --plan-run-id "${PLAN_RUN_ID}" --artifact-id "${ARTIFACT_ID}" \
            --artifact-name "${ARTIFACT_NAME}" --artifact-digest "${ARTIFACT_DIGEST}" \
            --plan-sha256 "${PLAN_SHA256}" --artifact-dir "${RUNNER_TEMP}/approved" \
            --plan-json "${RUNNER_TEMP}/approved/hosting.plan.rechecked.json" \
            --approval-comment-id "${APPROVAL_COMMENT_ID}"

      - name: Apply exact reviewed plan
        if: ${{ inputs.mode == 'apply' }}
        run: |
          set -euo pipefail
          tofu -chdir="${ROOT}" apply -input=false -lock=true "${RUNNER_TEMP}/approved/hosting.tfplan"

      - name: Verify interrupted rehearsal cleanup result
        if: ${{ inputs.mode == 'apply' && inputs.target == 'rehearsal' && (inputs.phase == 'cleanup-interrupted' || inputs.phase == 'cleanup-kms-residual') }}
        run: |
          set -euo pipefail
          tofu -chdir="${ROOT}" state pull |
            python3 -c 'import json,sys; d=json.load(sys.stdin); sys.exit(1 if d.get("lineage")!="d5ba55e1-56eb-a8ce-a60d-ef29aeafe0f2" or d.get("outputs") or any(r.get("mode")=="managed" and r.get("instances") for r in d.get("resources",[])) else 0)'
          aws ecs describe-clusters --clusters fieldzilla-production-rehearsal --output json |
