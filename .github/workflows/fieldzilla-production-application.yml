name: FieldZilla isolated application infrastructure rehearsal

on:
  workflow_call:
    inputs:
      workflow-tag:
        type: string
        required: true
      central-sha:
        type: string
        required: true
      caller-sha:
        type: string
        required: true
      artifact-id:
        type: string
        required: true
      artifact-run-id:
        type: string
        required: true
      manifest-sha256:
        type: string
        required: true
      approval-comment-id:
        type: string
        required: true
      expires-at:
        type: string
        required: true

permissions:
  actions: read
  checks: read
  contents: read
  deployments: write
  id-token: write
  issues: read
  pull-requests: read

# Serialize against the existing hosting lane in the application caller repo.
concurrency:
  group: fieldzilla-production-hosting
  cancel-in-progress: false

jobs:
  isolated-infrastructure:
    runs-on: ubuntu-latest
    environment: synergie-app-production
    timeout-minutes: 45
    env:
      AWS_REGION: ap-south-1
      GH_TOKEN: ${{ github.token }}
      CENTRAL_WORKFLOW_REF: Synergie-ITCI/.github/.github/workflows/fieldzilla-production-application.yml@refs/tags/${{ inputs.workflow-tag }}
      WORKFLOW_TAG: ${{ inputs.workflow-tag }}
      CENTRAL_SHA: ${{ inputs.central-sha }}
      CALLER_SHA: ${{ inputs.caller-sha }}
      ARTIFACT_ID: ${{ inputs.artifact-id }}
      ARTIFACT_RUN_ID: ${{ inputs.artifact-run-id }}
      MANIFEST_SHA: ${{ inputs.manifest-sha256 }}
      APPROVAL_COMMENT: ${{ inputs.approval-comment-id }}
      APPROVAL_EXPIRY: ${{ inputs.expires-at }}
    steps:
      - name: Verify main-only caller and actual reusable workflow identity
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, re, urllib.parse, urllib.request
          assert os.environ['GITHUB_REPOSITORY'] == 'Synergie-ITCI/programme-management-platform'
          assert os.environ['GITHUB_REF'] == 'refs/heads/main'
          assert os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch'
          assert os.environ['GITHUB_RUN_ATTEMPT'] == '1'
          assert os.environ['GITHUB_SHA'] == os.environ['CALLER_SHA']
          assert re.fullmatch(r'pr-qa-v1-rc[1-9][0-9]*', os.environ['WORKFLOW_TAG'])
          for key in ('CALLER_SHA', 'CENTRAL_SHA'):
              assert re.fullmatch(r'[0-9a-f]{40}', os.environ[key])
          for key in ('ARTIFACT_ID', 'ARTIFACT_RUN_ID', 'APPROVAL_COMMENT'):
              assert re.fullmatch(r'[1-9][0-9]*', os.environ[key])
          assert re.fullmatch(r'[0-9a-f]{64}', os.environ['MANIFEST_SHA'])
          url = os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']
          url += ('&' if '?' in url else '?') + urllib.parse.urlencode({'audience': 'sts.amazonaws.com'})
          request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
          with urllib.request.urlopen(request, timeout=20) as response:
              token = json.load(response)['value']
          payload = token.split('.')[1]
          claims = json.loads(base64.urlsafe_b64decode(payload + '=' * (-len(payload) % 4)))
          required = {
              'aud': 'sts.amazonaws.com',
              'repository': 'Synergie-ITCI/programme-management-platform',
              'repository_id': '1315697868',
              'repository_owner_id': '209829096',
              'environment': 'synergie-app-production',
              'sub': 'repo:Synergie-ITCI@209829096/programme-management-platform@1315697868:environment:synergie-app-production',
              'ref': 'refs/heads/main',
              'sha': os.environ['CALLER_SHA'],
              'job_workflow_ref': os.environ['CENTRAL_WORKFLOW_REF'],
              'job_workflow_sha': os.environ['CENTRAL_SHA'],
          }
          if any(str(claims.get(key)) != value for key, value in required.items()):
              raise SystemExit('Isolated rehearsal OIDC identity mismatch')
          print('Main-only isolated rehearsal identity verified; no AWS role assumed')
          PY

      - name: Checkout actual immutable execution release
        uses: actions/checkout@v4
        with:
          repository: Synergie-ITCI/.github
          ref: ${{ inputs.workflow-tag }}
          path: .central-framework
          persist-credentials: false

      - name: Verify published release protection and provenance
        run: |
          set -euo pipefail
          test "$(git -C .central-framework rev-parse HEAD)" = "${CENTRAL_SHA}"
          python3 .central-framework/pr-qa/release_pin.py --verify-bound "${WORKFLOW_TAG}" --commit "${CENTRAL_SHA}"

      - name: Verify exact manifest and unused owner authorization before AWS
        run: |
          set -euo pipefail
          python3 .central-framework/scripts/fieldzilla-production/application_runner.py validate \
            --artifact-id "${ARTIFACT_ID}" --artifact-run-id "${ARTIFACT_RUN_ID}" \
            --manifest-sha256 "${MANIFEST_SHA}" --approval-comment-id "${APPROVAL_COMMENT}" \
            --expires-at "${APPROVAL_EXPIRY}" --central-sha "${CENTRAL_SHA}" \
            --journal "${RUNNER_TEMP}/fieldzilla-execution.jsonl" --report "${RUNNER_TEMP}/fieldzilla-execution.json"

      - name: Assume only the separately approved isolated rehearsal identity
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::918870682888:role/SynergieFieldzillaProductionRehearsalApplicationDeploy
          aws-region: ap-south-1
          role-duration-seconds: 3600

      - name: Revalidate, consume authorization, migrate and verify isolated runtime
        run: |
          set -euo pipefail
          python3 .central-framework/scripts/fieldzilla-production/application_runner.py execute-infrastructure \
            --artifact-id "${ARTIFACT_ID}" --artifact-run-id "${ARTIFACT_RUN_ID}" \
            --manifest-sha256 "${MANIFEST_SHA}" --approval-comment-id "${APPROVAL_COMMENT}" \
            --expires-at "${APPROVAL_EXPIRY}" --central-sha "${CENTRAL_SHA}" \
            --journal "${RUNNER_TEMP}/fieldzilla-execution.jsonl" --report "${RUNNER_TEMP}/fieldzilla-execution.json"

      - name: Preserve metadata-only execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fieldzilla-isolated-infrastructure-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/fieldzilla-execution.jsonl
            ${{ runner.temp }}/fieldzilla-execution.json
          retention-days: 1
          if-no-files-found: warn

      - name: Keep application rehearsal and cutover gates open
        run: |
          echo 'Infrastructure execution is not application acceptance or Gate C/Gate D.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Authenticated API/Admin, sync/evidence, recovery and existing-client continuity remain required.' >> "$GITHUB_STEP_SUMMARY"
