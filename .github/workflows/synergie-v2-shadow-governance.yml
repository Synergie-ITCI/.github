name: Synergie Governance V2 Shadow

on:
  workflow_call:
    inputs:
      mode:
        description: Feature, promotion, candidate, release, or production-preflight validation mode.
        required: true
        type: string
      provenance-dir:
        description: Caller-relative directory containing feature provenance JSON artifacts.
        required: false
        default: ""
        type: string
      candidate-json:
        description: Caller-relative candidate JSON for exact candidate binding.
        required: false
        default: ""
        type: string
      qa-record:
        description: Caller-relative independent QA record JSON.
        required: false
        default: ""
        type: string
      production-approval:
        description: Authorized reviewer login for dry-run production selection only.
        required: false
        default: ""
        type: string
    outputs:
      candidate-id:
        description: Deterministic candidate identity generated by the verifier.
        value: ${{ jobs.evaluate.outputs.candidate-id }}
      status:
        description: PASS or FAIL from the non-blocking shadow verifier.
        value: ${{ jobs.evaluate.outputs.status }}

permissions:
  contents: read
  pull-requests: read
  actions: read

env:
  GOVERNANCE_V2_FRAMEWORK_RELEASE: "governance-v2-shadow-v2.0.0"

jobs:
  evaluate:
    name: Evaluate current PR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      candidate-id: ${{ steps.v2.outputs.candidate_id }}
      status: ${{ steps.v2.outputs.status }}
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch current pull request state
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > current-pr.json

      - name: Prepare local framework source
        if: ${{ github.repository == 'Synergie-ITCI/.github' }}
        run: |
          mkdir -p .governance-v2-framework
          rsync -a --exclude='.git' --exclude='.governance-v2-framework' ./ .governance-v2-framework/

      - name: Checkout immutable Governance V2 framework
        if: ${{ github.repository != 'Synergie-ITCI/.github' }}
        uses: actions/checkout@v4
        with:
          repository: Synergie-ITCI/.github
          ref: ${{ env.GOVERNANCE_V2_FRAMEWORK_RELEASE }}
          path: .governance-v2-framework
          persist-credentials: false

      - name: Collect feature provenance for a development to staging promotion
        if: ${{ inputs.mode == 'promotion' && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          mkdir -p governance-v2-provenance
          while read -r merge_sha; do
            [ -n "$merge_sha" ] || continue
            feature_sha="$(git rev-parse "${merge_sha}^2")"
            run_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?event=pull_request&head_sha=${feature_sha}&per_page=100" --jq '.workflow_runs[] | select(.name == "Governance V2 Shadow") | .id' | head -n 1 || true)"
            if [ -z "$run_id" ]; then
              echo "No Governance V2 feature workflow run found for ${feature_sha}." >&2
              continue
            fi
            artifact_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" --jq '.artifacts[] | select(.name == "v2-feature-provenance") | .id' | head -n 1 || true)"
            if [ -z "$artifact_id" ]; then
              echo "No feature provenance artifact found for ${feature_sha}." >&2
              continue
            fi
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "${RUNNER_TEMP}/${feature_sha}.zip"
            unzip -qo "${RUNNER_TEMP}/${feature_sha}.zip" -d "${RUNNER_TEMP}/${feature_sha}"
            mv "${RUNNER_TEMP}/${feature_sha}/v2-feature-provenance.json" "governance-v2-provenance/${feature_sha}.json"
          done < <(git rev-list --merges "${BASE_SHA}..HEAD")

      - name: Evaluate Governance V2 shadow evidence
        id: v2
        env:
          MODE: ${{ inputs.mode }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number || 0 }}
          PROVENANCE_DIR: ${{ inputs.provenance-dir }}
          CANDIDATE_JSON: ${{ inputs.candidate-json }}
          QA_RECORD: ${{ inputs.qa-record }}
          PRODUCTION_APPROVAL: ${{ inputs.production-approval }}
        run: |
          set -euo pipefail
          args=(
            --repo "$GITHUB_WORKSPACE"
            --repository "$GITHUB_REPOSITORY"
            --mode "$MODE"
            --head-sha "${{ github.event.pull_request.head.sha || github.sha }}"
            --base-sha "$BASE_SHA"
            --base-ref "$BASE_REF"
            --head-ref "$HEAD_REF"
            --pr-number "$PR_NUMBER"
            --out governance-v2-report.md
            --json-out governance-v2-report.json
            --github-output "$GITHUB_OUTPUT"
            --shadow
          )
          if [ -f current-pr.json ]; then args+=(--current-pr-json current-pr.json); fi
          if [ "$MODE" = "promotion" ]; then args+=(--provenance-dir governance-v2-provenance); fi
          if [ -n "$PROVENANCE_DIR" ]; then args+=(--provenance-dir "$PROVENANCE_DIR"); fi
          if [ -n "$CANDIDATE_JSON" ]; then args+=(--candidate-json "$CANDIDATE_JSON"); fi
          if [ -n "$QA_RECORD" ]; then args+=(--qa-record "$QA_RECORD"); fi
          if [ -n "$PRODUCTION_APPROVAL" ]; then args+=(--production-approval "$PRODUCTION_APPROVAL"); fi
          python3 .governance-v2-framework/governance-v2/governance_v2.py "${args[@]}"

      - name: Materialize feature provenance
        if: ${{ inputs.mode == 'feature' && always() }}
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = Path("governance-v2-report.json")
          if not report.exists():
              raise SystemExit("Governance V2 feature report was not generated")
          value = json.loads(report.read_text(encoding="utf-8"))
          provenance = value.get("feature_provenance")
          if not isinstance(provenance, dict):
              raise SystemExit("Governance V2 feature provenance was not generated")
          Path("v2-feature-provenance.json").write_text(
              json.dumps(provenance, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload immutable feature provenance
        if: ${{ inputs.mode == 'feature' && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: v2-feature-provenance
          path: v2-feature-provenance.json
          retention-days: 365

      - name: Upload Governance V2 shadow evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-v2-shadow-${{ github.run_id }}
          path: |
            governance-v2-report.md
            governance-v2-report.json
            v2-feature-provenance.json
          retention-days: 90
