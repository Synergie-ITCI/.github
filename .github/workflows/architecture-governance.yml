name: architecture-governance

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/**'
      - 'policy/**'
      - 'pr-qa/**'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  architecture-governance:
    name: Architecture Governance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate permanent governance policy JSON
        run: |
          python3 -m json.tool policy/pr-qa-policy.json >/dev/null
          python3 -m json.tool policy/status-check-registry.json >/dev/null

      - name: Run PR QA regression tests
        run: python3 -m unittest tests/test_pr_qa_regressions.py -q
