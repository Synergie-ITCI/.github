framework: Synergie Production Application Backup Framework
framework_version: "2026.08.09"
defaults:
  backup_bucket: synergie-production-app-backups-918870682888-ap-south-1
  aws_region: ap-south-1
  encryption: AES256
  retention_class: daily-35d-noncurrent-35d-current-45d
  schedule: "10 21 * * * UTC"
monitoring:
  default_sns_topic_arn: arn:aws:sns:ap-south-1:918870682888:synergie-monitor-platform-alerts
applications:
  - application_name: "Bayer"
    slug: bayer
    production_host: bayer.synergieinsights.in
    environment: production
    root: /var/www/bayer.synergieinsights.in/public_html
    database:
      engine: mariadb
      name: bayer_db
      credential_source: mysql_root_socket
      database_secret_reference: "runtime file /var/www/bayer.synergieinsights.in/public_html/.env DB_* keys; backup job uses local MariaDB root socket"
    persistent_paths:
      - id: storage_app_public
        path: /var/www/bayer.synergieinsights.in/public_html/storage/app/public
    backup_bucket: synergie-production-app-backups-918870682888-ap-south-1
    backup_prefix: applications/bayer
    rpo_class: daily-standard-production
    restore_test_class: isolated-temporary-mariadb-plus-persistent-sample
    owner: "Central Synergie DevOps / Disaster Recovery"
